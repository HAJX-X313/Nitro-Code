      if (tRel.status === "جنگ" && tRel.warWins > 0) s.push(`چون تا الان ${fmt(tRel.warWins)} پیروزی روی ${target} داشتی، احتمال قبول واقعی صلح بالاست — نه فقط وقت‌کشی.`);
      else if (tRel.status === "جنگ") s.push(`${target} هنوز شکست جدی نخورده، پس احتمالاً پیشنهاد صلح رو فقط برای خرید زمان و بازسازی ارتشش قبول می‌کنه، نه به‌خاطر تسلیم واقعی.`);
      else s.push(`با ${target} در جنگ نیستی، پس بحث صلح موضوعیت نداره؛ روابطتون الان «${tRel.status}» هست.`);
    } else s.push("یه کشور رو انتخاب کن تا بگم احتمال جدی بودن پیشنهاد صلحش چقدره.");
    sections.push(s.join("\n"));
  }
  if (has("جاسوس")) {
    const s = ["🎯 اولویت‌بندی عملیات جاسوسی:"];
    if (target && tRel) {
      const priority = tRel.status === "جنگ" ? "نقشه‌ی دفاعی و جابه‌جایی نیروهاشون" : tRel.power > militaryPower() ? "سطح فناوری نظامیشون" : "وضعیت خزانه و اقتصادشون";
      s.push(`برای ${target}، اولویت اول جاسوسی باید «${priority}» باشه — این بیشترین برگ برنده رو به تصمیم بعدیت می‌ده.`);
    } else s.push("در حالت کلی: اگه در جنگی، اول نقشه‌ی دفاعی طرف مقابل رو بگیر؛ اگه در صلحی، اول اقتصاد و فناوریش رو بررسی کن.");
    sections.push(s.join("\n"));
  }

  // --- rebellion & internal management: smart questions ---
  if (has("مالیات") && has("شورش", "استان")) {
    const s = ["🔥 ریسک شورش با افزایش مالیات:"];
    const risky = state.happiness < 45 ? "استان‌های کم‌درآمد و پرجمعیت اولین جایی‌ان که ناآرامی شروع می‌شه" : "با رضایت فعلی مردم، هنوز به آستانه‌ی شورش نرسیدی، ولی فاصله زیادی هم نداری";
    s.push(`${risky}. بیکاری الان ${fmt(state.unemployment)}%‌ه و رضایت ${fmt(state.happiness)}%؛ هرچی این دوتا بدتر بشه، افزایش مالیات خطرناک‌تر می‌شه.`);
    sections.push(s.join("\n"));
  }
  if (has("اشراف")) {
    const s = ["🏛️ تضعیف اشراف ناراضی بدون خون‌ریزی:"];
    s.push("بهترین راه، «قانون اصلاحات سیاسی» یا «قانون آزادی مطبوعات» تو تب قوانینه — با افزایش رضایت عمومی و شفافیت، پایگاه قدرت اشراف سنتی رو بدون درگیری مستقیم کم می‌کنه.");
    sections.push(s.join("\n"));
  }

  if (has("اقتصاد", "مالیات", "خزانه", "بودجه", "پول", "درآمد")) {
    const s = [pick(ADVISOR_INTROS_ECONOMY)];
    s.push(`خزانه: ${fmt(state.treasury)}M$ | نرخ مالیات: ${state.taxRate}%`);
    if (state.treasury < 0) s.push("⚠️ خزانه‌ت منفیه — یا مالیات رو بالا ببر یا هزینه‌های نظامی/زیرساختی رو کم کن، وگرنه وارد بحران اقتصادی می‌شی.");
    else if (state.treasury < 1000) s.push("خزانه‌ت کمه؛ قبل از خرید تجهیزات گرون یا شروع جنگ جدید، چند نوبت پس‌انداز کن.");
    else s.push("وضعیت خزانه خوبه — می‌تونی روی زیرساخت، تحقیقات یا ارتش سرمایه‌گذاری کنی.");
    if (state.inflation > 25) s.push(`⚠️ تورم ${fmt(state.inflation)}%‌ه و بالاست؛ مالیات خیلی بالا یا چاپ پول بی‌رویه می‌تونه بدترش کنه.`);
    sections.push(s.join("\n"));
  }
  if (has("ارتش", "نظامی", "جنگ", "حمله", "سرباز", "تانک", "جنگنده")) {
    const s = [pick(ADVISOR_INTROS_MILITARY)];
    s.push(`قدرت نظامی: ${fmt(militaryPower())}`);
    if (wars.length > 0) {
      s.push(`الان توی ${wars.length} جنگ فعال هستی: ${wars.map(([n]) => n).join("، ")}.`);
      s.push("تا جنگ‌های فعلی رو نبستی یا برنده نشدی، وارد جنگ جدید نشو — روی دو جبهه جنگیدن معمولاً خزانه و رضایت مردم رو نابود می‌کنه.");
    } else {
      s.push("الان درگیر جنگی نیستی. قبل از اعلام جنگ جدید، قدرت نظامی طرف مقابل رو با خودت مقایسه کن و یه دلیل موجه (casus belli) داشته باش تا افکار عمومی جهانی خیلی ضربه نخوره.");
    }
    sections.push(s.join("\n"));
  }
  if (has("دیپلماسی", "روابط", "اتحاد", "متحد", "صلح")) {
    const s = [pick(ADVISOR_INTROS_DIPLOMACY)];
    const allies = Object.entries(r).filter(([, v]) => v.status === "اتحاد").map(([n]) => n);
    s.push(allies.length ? `الان با ${allies.join("، ")} متحدی.` : "فعلاً هیچ متحدی نداری.");
    s.push("متحد داشتن قبل از جنگ خیلی مهمه — روابطت با قدرت‌های بزرگ (آمریکا، روسیه، چین) رو با تجارت یا کمک تقویت کن تا در بحران تنها نمونی.");
    sections.push(s.join("\n"));
  }
  if (has("هسته‌ای", "هسته ای", "بمب", "کلاهک")) {
    const s = [pick(ADVISOR_INTROS_NUCLEAR)];
    if (state.hasNuclearWeapon) s.push(`سلاح هسته‌ای داری (${fmt(state.nuclearWarheads || 0)} کلاهک). داشتنش بازدارندگی قویه ولی افکار عمومی جهانی رو پایین میاره و ریسک تحریم داره.`);
    else s.push(`در مرحله ${fmt(state.nuclearStage)}/3 برنامه هسته‌ای هستی. ادامه‌ش باعث نگرانی جهانی و احتمال تحریم می‌شه — با فناوری و خزانه بالا سریع‌تر پیش می‌ری.`);
    sections.push(s.join("\n"));
  }
  if (has("بحران", "تحریم")) {
    const s = [pick(ADVISOR_INTROS_CRISIS)];
    if (state.crisisTurns > 0) s.push(`⚠️ ${state.crisisTurns} نوبت دیگه در بحران اقتصادی هستی — مالیات رو مدیریت کن و از جنگ جدید پرهیز کن تا رد بشه.`);
    if (state.unSanctionTurns > 0) s.push(`🇺🇳 تحت تحریم سازمان ملل هستی (${state.unSanctionTurns} نوبت مونده) — این معمولاً درآمد و روابط تجاری رو کاهش می‌ده.`);
    if (state.crisisTurns === 0 && state.unSanctionTurns === 0) s.push("فعلاً نه بحران اقتصادی داری نه تحریمی — وضعیت باثباته.");
    sections.push(s.join("\n"));
  }
  if (has("رضایت", "بیکاری", "مردم", "اعتراض")) {
    const s = [pick(ADVISOR_INTROS_SOCIAL)];
    s.push(`رضایت مردم ${fmt(state.happiness)}% و بیکاری ${fmt(state.unemployment)}%‌ه.`);
    if (state.happiness < 35) s.push("⚠️ رضایت پایینه — ریسک ناآرامی داخلی داری. مالیات رو کم کن یا روی بهداشت/آموزش سرمایه‌گذاری کن.");
    if (state.unemployment > 20) s.push("بیکاری بالاست؛ ساخت کارخانه و نیروگاه معمولاً بهترین راه کاهششه.");
    sections.push(s.join("\n"));
  }
  if (has("فناوری", "تحقیق", "علم")) {
    const s = [pick(ADVISOR_INTROS_TECH)];
    s.push(`سطح فناوری: ${fmt(state.techLevel)}/100`);
    s.push("سرمایه‌گذاری روی دانشگاه و تحقیقات، هم اقتصادت رو تقویت می‌کنه هم پیشرفت پروژه هسته‌ای/نظامی رو سریع‌تر می‌کنه.");
    sections.push(s.join("\n"));
  }

  if (sections.length > 0) return sections.join("\n\n");

  // fallback: general status + open invitation, phrased differently each time
  const summaryIntro = pick([
    `وضعیت کلی ${state.playerCountry.flag} ${state.playerCountry.name} در سال ${fmt(state.year)}:`,
    `بذار یه گزارش کلی از ${state.playerCountry.name} بدم:`,
    `این خلاصه وضعیت فعلیته:`,
  ]);
  const lines = [summaryIntro];
  lines.push(`💰 خزانه ${fmt(state.treasury)}M$ | 😊 رضایت ${fmt(state.happiness)}% | ⚔️ قدرت نظامی ${fmt(militaryPower())} | 🇺🇳 افکار عمومی جهانی ${fmt(state.worldOpinion)}/100`);
  const worries = [];
  if (state.treasury < 0) worries.push("خزانه منفی");
  if (state.happiness < 35) worries.push("رضایت پایین مردم");
  if (state.inflation > 25) worries.push("تورم بالا");
  if (wars.length > 0) worries.push(`درگیری در ${wars.length} جنگ`);
  if (state.crisisTurns > 0) worries.push("بحران اقتصادی");
  lines.push(worries.length ? `مهم‌ترین نگرانی‌ها الان: ${worries.join("، ")}.` : "فعلاً وضعیت باثباته — می‌تونی روی رشد بلندمدت (فناوری، زیرساخت، دیپلماسی) تمرکز کنی.");
  lines.push(pick(ADVISOR_UNKNOWN));
  return lines.join("\n");
}

function sendAdvisorMessage(text) {
  if (!text.trim() || advisorLoading) return;
  advisorMessages.push({ role: "user", content: text });
  advisorLoading = true;
  renderTabContent();
  // tiny delay just so it doesn't feel like a static instant lookup
  setTimeout(() => {
    advisorMessages.push({ role: "assistant", content: generateAdvisorReply(text) });
    advisorLoading = false;
    renderTabContent();
  }, 250);
}

    const soldierCost = 260 + Math.floor(state.soldiers / 5000) * 4;
    const cSoldiers = cardEl("👥", "نیروی انسانی", "#c0453f");
    const subS = document.createElement("div"); subS.className = "card-sub"; subS.textContent = `تعداد: ${fmt(state.soldiers)} نفر`;
    cSoldiers.appendChild(subS);
    cSoldiers.appendChild(actionBtn("استخدام ۵٬۰۰۰ سرباز", soldierCost, act.soldiers, "#c0453f"));
    el.appendChild(cSoldiers);

    const roster = rosterFor(state.playerCountry.id);
    const categories = [
      { key: "ground", aggregateKey: "tanks", label: "زرهی و نیروی زمینی", accent: "#c0453f", act: act.tank, scaling: 10, base: 160 },
      { key: "artillery", aggregateKey: "artillery", label: "توپخانه و موشک", accent: "#d98a3d", act: act.artillery, scaling: 14, base: 210 },
      { key: "air", aggregateKey: "jets", label: "نیروی هوایی", accent: "#5b8fb9", act: act.jet, scaling: 40, base: 650 },
      { key: "navy", aggregateKey: "ships", label: "نیروی دریایی", accent: "#7fbf8f", act: act.ship, scaling: 35, base: 520 },
    ];
    categories.forEach(cat => {
      const c = cardEl(roster[cat.key][0]?.icon || "🛡️", cat.label, cat.accent);
      const subCat = document.createElement("div"); subCat.className = "card-sub";
      subCat.textContent = `مجموع این دسته: ${state[cat.aggregateKey]} · هزینه واحد بعدی: ${fmt(cat.base + state[cat.aggregateKey] * cat.scaling)}M$`;
      c.appendChild(subCat);
      roster[cat.key].forEach(item => {
        const owned = state.unitPicks[cat.key][item.id] || 0;
        const row = document.createElement("button");
        row.className = "action-btn";
        row.innerHTML = `<span>${item.icon} ${item.name} <span style="color:#8a92a3;">(${fmt(owned)})</span></span><span class="action-cost" style="color:${cat.accent};">${fmt(cat.base + state[cat.aggregateKey] * cat.scaling)}M$</span>`;
        row.onclick = () => cat.act(item.id);
        c.appendChild(row);
      });
      el.appendChild(c);
    });
  }

  if (state.activeTab === "un") {
    const opColor = state.worldOpinion >= 65 ? "#4caf7d" : state.worldOpinion >= 35 ? "#c9a24b" : "#c0453f";
    const unCard = cardEl("🇺🇳", "افکار عمومی جهانی", opColor);
    const unRow = document.createElement("div"); unRow.className = "country-row";
    unRow.innerHTML = `<span style="color:#8a92a3;">جایگاه بین‌المللی شما</span><span style="color:${opColor}; font-weight:700;">${Math.round(state.worldOpinion)}/100</span>`;
    unCard.appendChild(unRow);
    const unBarBg = document.createElement("div"); unBarBg.className = "bar-bg";
    const unBarFill = document.createElement("div"); unBarFill.className = "bar-fill";
    unBarFill.style.width = clamp(state.worldOpinion, 0, 100) + "%"; unBarFill.style.background = opColor;
    unBarBg.appendChild(unBarFill); unCard.appendChild(unBarBg);
    const unNote = document.createElement("div"); unNote.className = "range-note"; unNote.style.marginTop = "6px";
    unNote.textContent = state.unSanctionTurns > 0
      ? `🚨 سازمان ملل جنگ‌های اخیر شما را محکوم کرده و تحریم‌های اقتصادی اعمال شده است (${state.unSanctionTurns} نوبت باقی‌مانده).`
      : "اعلام جنگ بدون دلیل موجه، سازمان ملل و افکار عمومی جهانی را علیه شما بسیج می‌کند و به تحریم می‌انجامد؛ جنگ‌های موجه از نظر جهانی تأثیر مثبتی بر جایگاه شما دارند.";
    unCard.appendChild(unNote);
    el.appendChild(unCard);

    const scCard = cardEl("🏛️", "اعضای دائم شورای امنیت", "#5b8fb9");
    const scSub = document.createElement("div"); scSub.className = "card-sub";
    scSub.textContent = "پیش از هر اعلام جنگ رسمی، پرونده باید در شورای امنیت مطرح شود. اگر هر یک از این سه قدرت با جنگ شما مخالفت کند (وتو)، حق اعلام رسمی جنگ را نخواهید داشت — مگر با دلیلی موجه‌تر یا با بهبود روابط دوجانبه.";
    scCard.appendChild(scSub);
    PERMANENT_MEMBERS.forEach(member => {
      const row = document.createElement("div"); row.className = "country-row";
      const cInfo = COUNTRIES.find(x => x.name === member);
      const rel = state.relations[member];
      let statusText, color;
      if (!rel) { statusText = "کشور تحت رهبری شما"; color = "#c9a24b"; }
      else { statusText = `${rel.status} · روابط ${Math.round(rel.score)}/100`; color = statusColor[rel.status]; }
      row.innerHTML = `<span>${cInfo?.flag || ""} ${member}</span><span style="color:${color}; font-weight:700;">${statusText}</span>`;
      scCard.appendChild(row);
    });
    el.appendChild(scCard);
  }

  if (state.activeTab === "diplomacy") {
    Object.entries(state.relations).forEach(([country, r]) => {
      if (state.warJustifyTarget === country) { el.appendChild(buildWarJustifyPanel(country)); return; }
      const c = cardEl("🌐", `${r.flag ? r.flag + " " : ""}${country}`, statusColor[r.status]);
      const row = document.createElement("div"); row.className = "country-row";
      row.innerHTML = `<span style="color:#8a92a3;">وضعیت: <span style="color:${statusColor[r.status]}; font-weight:700;">${r.status}</span></span><span style="color:#8a92a3;">امتیاز روابط: ${Math.round(r.score)}/100</span>`;
      c.appendChild(row);
      const barBg = document.createElement("div"); barBg.className = "bar-bg";
      const barFill = document.createElement("div"); barFill.className = "bar-fill";
      barFill.style.width = r.score + "%"; barFill.style.background = statusColor[r.status];
      barBg.appendChild(barFill); c.appendChild(barBg);

      if ((r.blockadeTurns || 0) > 0) {
        const bNote = document.createElement("div"); bNote.className = "range-note"; bNote.style.color = "#5b8fb9";
        bNote.textContent = `🚢 در محاصره دریایی شماست (${r.blockadeTurns} نوبت باقی‌مانده).`;
        c.appendChild(bNote);
      }

      appendCountryActionButtons(c, country, r, true);
      el.appendChild(c);
    });
  }

  if (state.activeTab === "tech") {
    const c = cardEl("🔬", "تحقیقات و فناوری", "#9b7fd4");
    const sub = document.createElement("div"); sub.className = "card-sub"; sub.style.marginBottom = "4px";
    sub.textContent = `سطح فناوری: ${Math.round(state.techLevel)}/100`;
    c.appendChild(sub);
    const barBg = document.createElement("div"); barBg.className = "bar-bg";
    const barFill = document.createElement("div"); barFill.className = "bar-fill";
    barFill.style.width = state.techLevel + "%"; barFill.style.background = "#9b7fd4";
    barBg.appendChild(barFill); c.appendChild(barBg);
    const note = document.createElement("div"); note.className = "range-note"; note.style.marginBottom = "12px";
    note.textContent = `هر دانشگاه بازده پروژه‌های تحقیقاتی را افزایش می‌دهد. دانشگاه‌های فعلی: ${state.universities}`;
    c.appendChild(note);
    c.appendChild(actionBtn("آغاز پروژه تحقیقاتی", 550, act.research, "#9b7fd4"));
    const nukeNote = document.createElement("div"); nukeNote.className = "range-note"; nukeNote.style.marginTop = "10px";
    nukeNote.textContent = state.hasNuclearWeapon
      ? `☢️ کشور شما به سلاح هسته‌ای دست یافته است. کلاهک‌های موجود: ${fmt(state.nuclearWarheads || 0)}`
      : `برنامه هسته‌ای از بخش «کانون‌های ملی» پیگیری می‌شود (مرحله فعلی: ${fmt(state.nuclearStage)}/3).`;
    c.appendChild(nukeNote);
    if (state.hasNuclearWeapon) {
      const warheadCost = 1800 + (state.nuclearWarheads || 0) * 250;
      const wBtn = actionBtn("🧨 تولید کلاهک هسته‌ای جدید", warheadCost, act.warhead, "#9b7fd4");
      wBtn.style.marginTop = "8px";
      c.appendChild(wBtn);
      const useNote = document.createElement("div"); useNote.className = "range-note"; useNote.style.marginTop = "6px";
      useNote.textContent = "کلاهک‌ها فقط علیه کشورهایی قابل استفاده‌اند که با آن‌ها در جنگ هستید — دکمه «☢️ حمله هسته‌ای» در تب دیپلماسی یا نقشه ظاهر می‌شود.";
      c.appendChild(useNote);
    }
    el.appendChild(c);
  }

  if (state.activeTab === "focus") {
    const c0 = cardEl("🎯", "کانون‌های ملی", "#d98a3d");
    const sub0 = document.createElement("div"); sub0.className = "card-sub";
    sub0.textContent = state.activeFocus
      ? `در حال پیشرفت: ${(FOCUS_TREE.find(f => f.id === state.activeFocus.id) || {}).name} (${state.activeFocus.turnsLeft} نوبت باقی‌مانده)`
      : "در هر لحظه فقط یک کانون می‌تواند در حال پیشرفت باشد. برخی کانون‌ها به پیش‌نیاز یا سطح فناوری خاصی نیاز دارند.";
    c0.appendChild(sub0);
    el.appendChild(c0);

    const cats = [...new Set(FOCUS_TREE.map(f => f.cat))];
    cats.forEach(cat => {
      const c = cardEl("📂", cat, "#c9a24b");
      FOCUS_TREE.filter(f => f.cat === cat).forEach(f => {
        const done = state.completedFocuses.includes(f.id);
        const locked = f.requires.some(r => !state.completedFocuses.includes(r)) || (f.minTech && state.techLevel < f.minTech);
        const inProgress = state.activeFocus && state.activeFocus.id === f.id;
        const row = document.createElement("div");
        row.style.cssText = "border:1px solid #2a3542; border-radius:8px; padding:8px 10px; margin-bottom:8px;";
        row.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <span style="font-weight:700;">${f.icon} ${f.name}${done ? " ✅" : locked ? " 🔒" : ""}</span>
          <span style="font-size:11px; color:#8a92a3;">${fmt(f.cost)}M$ · ${f.turns} نوبت</span>
        </div><div style="font-size:11px; color:#8a92a3;">${f.desc}${f.minTech ? ` (نیازمند فناوری ${f.minTech}+)` : ""}</div>`;
        if (!done) {
          const btn = document.createElement("button");
          btn.className = "action-btn"; btn.style.marginTop = "6px";
          const disabled = locked || (!!state.activeFocus && !inProgress);
          btn.disabled = disabled;
          btn.style.opacity = disabled ? "0.45" : "1";
          btn.innerHTML = inProgress
            ? `<span>در حال انجام… (${state.activeFocus.turnsLeft} نوبت باقی‌مانده)</span>`
            : `<span>${locked ? "نیازمندی‌ها تکمیل نشده" : "آغاز کانون"}</span>`;
          if (!disabled && !inProgress) btn.onclick = () => startFocus(f.id);
          row.appendChild(btn);
        }
        c.appendChild(row);
      });
      el.appendChild(c);
    });
  }

  if (state.activeTab === "laws") {
    const c0 = cardEl("⚖️", "قوانین و لوایح", "#5b8fb9");
    const sub0 = document.createElement("div"); sub0.className = "card-sub";
    sub0.textContent = "هر لایحه پس از پیشنهاد به رأی‌گیری گذاشته می‌شود؛ شانس تصویب به رضایت عمومی مردم بستگی دارد. هزینه‌ی لایحه (هزینه‌ی کمپین و چانه‌زنی در مجلس) در هر صورت — چه تصویب شود، چه رد — از خزانه کسر می‌شود.";
    c0.appendChild(sub0);
    el.appendChild(c0);
    LAWS.forEach(lawItem => {
      const passed = state.enactedLaws.includes(lawItem.id);
      const locked = lawItem.minTech && state.techLevel < lawItem.minTech;
      const c = cardEl(lawItem.icon, lawItem.name, passed ? "#7fbf8f" : "#5b8fb9");
      const sub = document.createElement("div"); sub.className = "card-sub"; sub.textContent = lawItem.desc;
      c.appendChild(sub);
      if (passed) {
        const note = document.createElement("div"); note.className = "range-note";
        note.textContent = "✅ این لایحه به تصویب رسیده است.";
        c.appendChild(note);
      } else {
        const chance = clamp(0.55 + (state.happiness - 50) / 250, 0.25, 0.9);
        const note = document.createElement("div"); note.className = "range-note"; note.style.marginBottom = "6px";
        note.textContent = locked ? `نیازمند سطح فناوری حداقل ${lawItem.minTech}` : `شانس تصویب در مجلس: ٪${Math.round(chance * 100)}`;
        c.appendChild(note);
        const btn = actionBtn("پیشنهاد و رأی‌گیری", lawItem.cost, () => passLaw(lawItem.id), "#5b8fb9");
        if (locked) { btn.disabled = true; btn.style.opacity = "0.45"; btn.onclick = null; }
        c.appendChild(btn);
      }
      el.appendChild(c);
    });
  }

  if (state.activeTab === "leadership") {
    if (state.pendingSuccession) {
      const c0 = cardEl("👑", "انتخاب وارث", "#c9a24b");
      const sub0 = document.createElement("div"); sub0.className = "card-sub";
      sub0.textContent = "رهبر پیشین کناره‌گیری کرد. یکی از وارثان زیر را برای رهبری بعدی کشور انتخاب کنید — هر کدام سبک متفاوتی دارند.";
      c0.appendChild(sub0);
      el.appendChild(c0);
      state.pendingSuccession.forEach((heir, idx) => {
        const style = LEADER_STYLES.find(x => x.id === heir.styleId);
        const c = cardEl(style.icon, `${heir.name} · ${style.name}`, "#5b8fb9");
        const sub = document.createElement("div"); sub.className = "card-sub"; sub.textContent = `سن: ${fmt(heir.age)} — ${style.desc}`;
        c.appendChild(sub);
        const btn = document.createElement("button");
        btn.className = "action-btn"; btn.style.justifyContent = "center";
        btn.innerHTML = `<span>انتخاب به‌عنوان رهبر جدید</span>`;
        btn.onclick = () => chooseHeir(idx);
        c.appendChild(btn);
        el.appendChild(c);
      });
    } else if (state.leader) {
      const style = LEADER_STYLES.find(x => x.id === state.leader.styleId);
      const c = cardEl(style.icon, `${state.leader.name} · رهبر فعلی`, "#c9a24b");
      const sub = document.createElement("div"); sub.className = "card-sub"; sub.textContent = `سن: ${fmt(state.leader.age)} سال — سبک رهبری: ${style.name}`;
      c.appendChild(sub);
      const desc = document.createElement("div"); desc.className = "range-note"; desc.textContent = style.desc;
      c.appendChild(desc);
      el.appendChild(c);

      const c2 = cardEl("📜", "نسل‌های پیشین رهبری", "#7fbf8f");
      if (!state.leaderHistory || state.leaderHistory.length === 0) {
        const note = document.createElement("div"); note.className = "range-note"; note.textContent = "هنوز جانشینی رخ نداده است.";
        c2.appendChild(note);
      } else {
        state.leaderHistory.slice().reverse().forEach(prev => {
          const pStyle = LEADER_STYLES.find(x => x.id === prev.styleId);
          const row = document.createElement("div"); row.className = "country-row";
          row.innerHTML = `<span>${pStyle.icon} ${prev.name}</span><span style="color:#8a92a3;">${pStyle.name}</span>`;
          c2.appendChild(row);
        });
      }
      el.appendChild(c2);
    }
  }

  if (state.activeTab === "achievements") {
    const c0 = cardEl("🏆", "دستاوردها", "#c9a24b");
    const sub0 = document.createElement("div"); sub0.className = "card-sub";
    sub0.textContent = `${(state.unlockedAchievements || []).length} از ${ACHIEVEMENTS.length} دستاورد کسب شده است.`;
    c0.appendChild(sub0);
    el.appendChild(c0);
    ACHIEVEMENTS.forEach(a => {
      const unlocked = (state.unlockedAchievements || []).includes(a.id);
      const c = cardEl(a.icon, a.name, unlocked ? "#c9a24b" : "#8a92a3");
      c.style.opacity = unlocked ? "1" : "0.55";
      const sub = document.createElement("div"); sub.className = "card-sub"; sub.textContent = a.desc;
      c.appendChild(sub);
      const note = document.createElement("div"); note.className = "range-note";
      note.textContent = unlocked ? "✅ کسب شده" : "🔒 هنوز کسب نشده";
      c.appendChild(note);
      el.appendChild(c);
    });
  }

  if (state.activeTab === "advisor") {
    const chatCard = cardEl("🤖", "مشاور هوش مصنوعی", "#c9a24b");
    const chatSub = document.createElement("div"); chatSub.className = "card-sub";
    chatSub.textContent = "درباره وضعیت کشورت و استراتژی اقتصادی، نظامی یا دیپلماسی سؤال بپرس.";
    chatCard.appendChild(chatSub);

    const chatList = document.createElement("div");
    chatList.className = "log-list";
    chatList.style.cssText = chatList.style.cssText + "display:flex; flex-direction:column; gap:8px; margin-bottom:12px;";
    if (advisorMessages.length === 0) {
      const empty = document.createElement("div"); empty.className = "range-note"; empty.textContent = "هنوز پیامی رد و بدل نشده. یه سؤال بپرس!";
      chatList.appendChild(empty);
    }
    advisorMessages.forEach(m => {
      const bubble = document.createElement("div");
      const isUser = m.role === "user";
      const isNote = m.role === "system-note";
      const isAlert = m.role === "advisor-alert";
      bubble.style.cssText = "max-width:85%; padding:8px 12px; border-radius:10px; font-size:12px; line-height:1.6; white-space:pre-wrap; align-self:" +
        (isUser ? "flex-end" : "flex-start") + "; background:" + (isUser ? "#1c2530" : isAlert ? "#2a2313" : isNote ? "#2b1c1c" : "#20304a") +
        "; color:" + (isAlert ? "#e8cf8a" : isNote ? "#e5a9a3" : "#eae6da") + "; border:1px solid " + (isUser ? "#2a3542" : isAlert ? "#6b5a2f" : isNote ? "#5a2f2f" : "#2a4a6a") + ";";
      bubble.textContent = m.content;
      chatList.appendChild(bubble);
    });
    if (advisorLoading) {
      const loadingEl = document.createElement("div");
      loadingEl.style.cssText = "align-self:flex-start; font-size:12px; color:#8a92a3;";
      loadingEl.textContent = "در حال فکر کردن...";
      chatList.appendChild(loadingEl);
    }
    chatCard.appendChild(chatList);

    // general loyalty gauge — a quiet reminder of the coup-risk clock the advisor is tracking
    const loyaltyRow = document.createElement("div");
    loyaltyRow.style.cssText = "display:flex; align-items:center; justify-content:space-between; font-size:11px; color:#8a92a3; margin-bottom:10px;";
    const loyaltyColor = state.generalLoyalty < 30 ? "#e07a6f" : state.generalLoyalty < 55 ? "#c9a24b" : "#7fbf8f";
    loyaltyRow.innerHTML = `<span>🎖️ وفاداری فرماندهان ارتش</span><span style="color:${loyaltyColor}; font-weight:700;">${fmt(state.generalLoyalty)}%</span>`;
    chatCard.appendChild(loyaltyRow);

    // suggested-question chips, grouped into the 4 categories a sharp commander would ask about
    const suggestToggle = document.createElement("button");
    suggestToggle.className = "tab-btn";
    suggestToggle.style.cssText = "margin-bottom:8px;";
    suggestToggle.textContent = advisorSuggestOpen ? "▲ بستن سؤال‌های پیشنهادی" : "💡 سؤال‌های پیشنهادی";
    suggestToggle.onclick = () => { advisorSuggestOpen = !advisorSuggestOpen; renderTabContent(); };
    chatCard.appendChild(suggestToggle);

    if (advisorSuggestOpen) {
      const suggestBox = document.createElement("div");
      suggestBox.style.cssText = "display:flex; flex-direction:column; gap:8px; margin-bottom:12px; padding:10px; border:1px solid #2a3542; border-radius:8px; background:#161f29;";
      Object.entries(ADVISOR_SUGGESTED_QUESTIONS).forEach(([cat, questions]) => {
        const catLabel = document.createElement("div");
        catLabel.style.cssText = "font-size:11px; color:#8a92a3; font-weight:700;";
        catLabel.textContent = cat;
        suggestBox.appendChild(catLabel);
        const chipRow = document.createElement("div");
        chipRow.style.cssText = "display:flex; flex-wrap:wrap; gap:6px; margin-bottom:4px;";
        questions.forEach(q => {
          const chip = document.createElement("button");
          chip.textContent = q;
          chip.style.cssText = "font-family:inherit; font-size:11px; padding:6px 10px; border-radius:14px; border:1px solid #2a4a6a; background:#1c2530; color:#b9c0cc; cursor:pointer; text-align:right;";
          chip.disabled = advisorLoading;
          chip.onclick = () => { advisorSuggestOpen = false; sendAdvisorMessage(q); };
          chipRow.appendChild(chip);
        });
        suggestBox.appendChild(chipRow);
      });
      chatCard.appendChild(suggestBox);
    }

    const inputRow = document.createElement("div"); inputRow.style.cssText = "display:flex; gap:8px;";
    const msgInput = document.createElement("input");
    msgInput.type = "text";
    msgInput.placeholder = "سؤالت رو بپرس...";
    msgInput.style.cssText = "flex:1; padding:9px 12px; border-radius:8px; border:1px solid #2a3542; background:#1c2530; color:#eae6da; font-family:inherit; font-size:12px;";
    msgInput.disabled = advisorLoading;
    const sendBtn = document.createElement("button");
    sendBtn.textContent = "ارسال";
    sendBtn.className = "end-turn-btn";
    sendBtn.disabled = advisorLoading;
    const doSend = () => {
      const val = msgInput.value;
      if (!val.trim() || advisorLoading) return;
      msgInput.value = "";
      sendAdvisorMessage(val);
    };
    sendBtn.onclick = doSend;
    msgInput.onkeydown = (e) => { if (e.key === "Enter") doSend(); };
    inputRow.appendChild(msgInput);
    inputRow.appendChild(sendBtn);
    chatCard.appendChild(inputRow);

    el.appendChild(chatCard);
  }
}

function renderSidebar() {
  const forecast = projectNextTurn();
  const forecastPanel = document.getElementById("forecastPanel");
  forecastPanel.innerHTML = "";
  const incomeRow = document.createElement("div"); incomeRow.className = "stat-row";
  incomeRow.innerHTML = `<span class="stat-row-label">درآمد خالص تخمینی</span><span class="stat-row-value${forecast.netIncome < 0 ? ' bad' : ''}">${forecast.netIncome >= 0 ? '+' : ''}${fmt(forecast.netIncome)}M$</span>`;
  forecastPanel.appendChild(incomeRow);
  const happyRow = document.createElement("div"); happyRow.className = "stat-row";
  const happyArrow = forecast.happinessDelta > 0.3 ? "↑" : forecast.happinessDelta < -0.3 ? "↓" : "→";
  happyRow.innerHTML = `<span class="stat-row-label">تغییر رضایت مردم</span><span class="stat-row-value${forecast.happinessDelta < -0.3 ? ' bad' : ''}">${happyArrow} ${forecast.happinessDelta >= 0 ? '+' : ''}${forecast.happinessDelta.toFixed(1)}%</span>`;
  forecastPanel.appendChild(happyRow);
  const note = document.createElement("div"); note.className = "range-note";
  note.textContent = forecast.atWar
    ? "تخمینی است؛ هزینه‌های جنگ و رویدادهای تصادفی می‌توانند نتیجه واقعی را تغییر دهند."
    : "تخمینی بر اساس شرایط فعلی؛ رویدادهای تصادفی ممکن است آن را تغییر دهند.";
  forecastPanel.appendChild(note);

  const keyStats = document.getElementById("keyStats");
  keyStats.innerHTML = "";
  const rows = [
    ["بیکاری", `${fmt(state.unemployment)}%`, state.unemployment > 20],
    ["آموزش", `${fmt(state.education)}/100`, false],
    ["بهداشت", `${fmt(state.health)}/100`, false],
    ["فناوری", `${fmt(state.techLevel)}/100`, false],
    ["قدرت نظامی", fmt(militaryPower()), false],
    ["وضعیت هسته‌ای", state.hasNuclearWeapon ? `☢️ مسلح (${fmt(state.nuclearWarheads || 0)} کلاهک)` : `مرحله ${fmt(state.nuclearStage)}/3`, false],
    ["🇺🇳 افکار عمومی جهانی", `${fmt(state.worldOpinion)}/100`, state.worldOpinion < 35],
    ["📈 تورم", `${fmt(state.inflation)}%`, state.inflation > 25],
  ];
  rows.forEach(([label, value, bad]) => {
    const row = document.createElement("div"); row.className = "stat-row";
    row.innerHTML = `<span class="stat-row-label">${label}</span><span class="stat-row-value${bad ? ' bad' : ''}">${value}</span>`;
    keyStats.appendChild(row);
  });
  if (state.crisisTurns > 0) {
    const note = document.createElement("div"); note.className = "crisis-note";
    note.textContent = `⚠️ بحران اقتصادی (${state.crisisTurns} نوبت باقی‌مانده)`;
    keyStats.appendChild(note);
  }
  if (state.unSanctionTurns > 0) {
    const note = document.createElement("div"); note.className = "crisis-note";
    note.textContent = `🇺🇳 تحریم‌های سازمان ملل (${state.unSanctionTurns} نوبت باقی‌مانده)`;
    keyStats.appendChild(note);
  }

  const logList = document.getElementById("eventLogList");
  logList.innerHTML = "";
  state.eventLog.forEach(e => {
    const item = document.createElement("div"); item.className = "log-item"; item.textContent = e;
    logList.appendChild(item);
  });
}

document.getElementById("endTurnBtn").onclick = () => { hotseat.active ? hotseatAdvance() : endTurn(); };
document.getElementById("newGameBtn").onclick = () => {
  showConfirmModal(
    "بازی جدید",
    "بازی فعلی پاک شود و از نو شروع شود؟",
    () => {
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      state = freshState();
      hotseat = { active: false, turnOf: 1, snapshots: [null, null] };
      hotseatSetupStage = 0; hotseatP1Choice = null;
      advisorMessages = [];
      advisorLoading = false;
      advisorSuggestOpen = false;
      render();
    }
  );
};

// custom confirm dialog — window.confirm() is blocked or silently a no-op inside many
// embedded webviews / installed PWA shells, which made the new-game button look dead.
function showConfirmModal(title, body, onConfirm) {
  const existing = document.getElementById("customConfirmOverlay");
  if (existing) existing.remove();
  const overlay = document.createElement("div");
  overlay.id = "customConfirmOverlay";
  overlay.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:9999; padding:20px;";
  const box = document.createElement("div");
  box.style.cssText = "background:#141d27; border:1px solid #2a3542; border-radius:12px; padding:20px; max-width:340px; width:100%; text-align:center; font-family:inherit;";
  const t = document.createElement("div"); t.style.cssText = "font-weight:800; font-size:16px; margin-bottom:8px; color:#eae6da;"; t.textContent = title;
  const b = document.createElement("div"); b.style.cssText = "font-size:13px; color:#b9c0cc; margin-bottom:16px;"; b.textContent = body;
  const btnRow = document.createElement("div"); btnRow.style.cssText = "display:flex; gap:8px;";
  const okBtn = document.createElement("button");
  okBtn.textContent = "بله، شروع کن";
  okBtn.style.cssText = "flex:1; padding:10px; border-radius:8px; border:none; background:#c9a24b; color:#141d27; font-weight:700; cursor:pointer; font-family:inherit; font-size:13px;";
  okBtn.onclick = () => { overlay.remove(); onConfirm(); };
  const cancelBtn = document.createElement("button");
  cancelBtn.textContent = "انصراف";
  cancelBtn.style.cssText = "flex:1; padding:10px; border-radius:8px; border:1px solid #2a3542; background:#1c2530; color:#eae6da; font-weight:700; cursor:pointer; font-family:inherit; font-size:13px;";
  cancelBtn.onclick = () => overlay.remove();
  btnRow.appendChild(okBtn); btnRow.appendChild(cancelBtn);
  box.appendChild(t); box.appendChild(b); box.appendChild(btnRow);
  overlay.appendChild(box);
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}

// ---------- offline install + save progress ----------
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

const SAVE_KEY = "nation-empire-save";
function saveGame() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ state, hotseat })); } catch (e) {}
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // saves from before hotseat support stored the state object directly at the top level;
      // newer saves wrap it as {state, hotseat} — support both transparently
      const loaded = parsed && parsed.state ? parsed.state : parsed;
      if (parsed && parsed.hotseat && parsed.hotseat.active) hotseat = parsed.hotseat;
      // merge onto freshState() so older saves (before this update) get the new fields safely
      state = Object.assign(freshState(), loaded);
      if (!state.resources || typeof state.resources !== "object") state.resources = { oil: 60, food: 60, tech: 40 };
      if (typeof state.resourceTradeVolume !== "number") state.resourceTradeVolume = 0;
      if (typeof state.rebellionsIncited !== "number") state.rebellionsIncited = 0;
      if (!Array.isArray(state.unlockedAchievements)) state.unlockedAchievements = [];
      if (typeof state.peaceStreak !== "number") state.peaceStreak = 0;
      if (!Array.isArray(state.leaderHistory)) state.leaderHistory = [];
      if (!state.leader && state.playerCountry) state.leader = generateLeader();
      if (!Array.isArray(state.completedFocuses)) state.completedFocuses = [];
      if (!Array.isArray(state.enactedLaws)) state.enactedLaws = [];
      if (typeof state.nuclearStage !== "number") state.nuclearStage = 0;
      if (typeof state.hasNuclearWeapon !== "boolean") state.hasNuclearWeapon = false;
      if (typeof state.nuclearWarheads !== "number" || Number.isNaN(state.nuclearWarheads)) state.nuclearWarheads = state.hasNuclearWeapon ? 2 : 0;
      if (!state.relations || typeof state.relations !== "object") state.relations = {};
      if (typeof state.generalLoyalty !== "number" || Number.isNaN(state.generalLoyalty)) state.generalLoyalty = 72;
      if (typeof state.coupWarningTurns !== "number") state.coupWarningTurns = 0;
      if (!Array.isArray(state.advisorMemory)) state.advisorMemory = [];
      if (!state.unitPicks || typeof state.unitPicks !== "object") state.unitPicks = { ground: {}, air: {}, navy: {}, artillery: {} };
      ["ground", "air", "navy", "artillery"].forEach(cat => { if (!state.unitPicks[cat] || typeof state.unitPicks[cat] !== "object") state.unitPicks[cat] = {}; });
      // an old save's country/relations used the retired fictional roster — require a fresh pick
      if (!state.playerCountry || !COUNTRIES.some(c => c.id === state.playerCountry.id)) {
        state.playerCountry = null;
        state.relations = {};
      }
      // backfill any relation fields that didn't exist in older save versions — without this,
      // a missing `power` turns into NaN and silently breaks map radii, combat odds, and annex checks
      Object.entries(state.relations).forEach(([name, r]) => {
        if (typeof r.power !== "number" || Number.isNaN(r.power)) r.power = 80;
        if (typeof r.score !== "number" || Number.isNaN(r.score)) r.score = 30;
        if (!r.status) r.status = "خنثی";
        if (typeof r.warWins !== "number") r.warWins = 0;
        if (typeof r.warTurns !== "number") r.warTurns = 0;
        if (typeof r.blockadeTurns !== "number") r.blockadeTurns = 0;
        if (typeof r.citiesCaptured !== "number" || Number.isNaN(r.citiesCaptured)) r.citiesCaptured = 0;
        if (!r.flag) r.flag = COUNTRIES.find(c => c.name === name)?.flag || "";
      });
    }
  } catch (e) {}
}
loadGame();

const originalRender = render;
render = function () {
  originalRender();
  saveGame();
};

render();
</script>
