    z-index: 20;
  }

  .brand { display: flex; align-items: center; gap: 12px; }
  .seal {

  }
  .brand-title { font-size: 18px; font-weight: 800; }
  .brand-sub { font-size: 12px; }
  .stats-row { display: flex; align-items: center; gap: 16px; font-size: 13px; flex-wrap: wrap; }
  .stat { text-align: center; }
  .stat-label { font-size: 10px; color: #8a92a3; }
  .stat-value { font-weight: 700; }
  .end-turn-btn {
    padding: 9px 16px; border-radius: 8px; background: #c9a24b; color: #141d27;
    font-weight: 700; font-size: 13px; border: none; cursor: pointer;
  }
  .end-turn-btn:hover { filter: brightness(1.1); }
  .end-turn-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .power-bar-bg { margin-top: 12px; height: 6px; border-radius: 3px; background: #232d38; overflow: hidden; }
  .power-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }

  .tabs { max-width: 1000px; margin: 0 auto; padding: 0 16px 10px; display: flex; gap: 4px; overflow-x: auto; }
  .tab-btn {
    display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 6px;
    font-size: 12px; white-space: nowrap; background: #1c2530; color: #b9c0cc; border: none; cursor: pointer;
  }
  .tab-btn.active { background: #c9a24b; color: #141d27; font-weight: 700; }
  .tab-btn:hover:not(.active) { background: #232d38; }

  .flash {
    max-width: 1000px; margin: 0 auto; padding: 12px 16px 0;
  }
  .flash-box {
    border-radius: 8px; padding: 10px 12px; font-size: 12px; display: flex;
    align-items: flex-start; justify-content: space-between; gap: 8px; border: 1px solid #2a3542;
    background: #1c2530; color: #b9c0cc;
  }
  .flash-box.warn { background: #2b1c1c; border-color: #5a2f2f; color: #e5a9a3; }
  .flash-title { font-weight: 700; margin-bottom: 2px; }
  .flash-close { background: none; border: none; color: #8a92a3; cursor: pointer; font-size: 13px; }

  .gameover { max-width: 1000px; margin: 0 auto; padding: 12px 16px 0; }
  .gameover-box { border-radius: 12px; padding: 16px; text-align: center; border: 1px solid; }
  .gameover-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .gameover-body { font-size: 13px; }

  .main { max-width: 1000px; margin: 0 auto; padding: 20px 16px; display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
  @media (max-width: 800px) { .main { grid-template-columns: 1fr; } }

  .card { border-radius: 12px; background: #141d27; border: 1px solid #232d38; padding: 16px; margin-bottom: 16px; }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .card-icon { font-size: 16px; }
  .card-title { font-weight: 700; font-size: 14px; }
  .card-sub { font-size: 12px; color: #8a92a3; margin-bottom: 12px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
  .grid2-4 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .action-btn {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; border-radius: 8px; background: #1c2530; border: 1px solid #2a3542;
    color: #eae6da; font-size: 12px; cursor: pointer; margin-bottom: 6px; font-family: inherit;

  .action-btn:hover { background: #232d38; }
  .action-btn:active { transform: scale(0.98); }
  .action-cost { font-weight: 700; }

  .range-label { font-size: 12px; color: #b9c0cc; }
  .range-note { font-size: 10px; color: #8a92a3; margin-top: 4px; }

  .stat-row-label { color: #8a92a3; }
  .stat-row-value { font-weight: 700; }

  { id: "trader", icon: "📦", name: "تاجر بزرگ", desc: "مجموعاً ۵۰۰ واحد منابع را در بازار جهانی معامله کنید.", check: s => (s.resourceTradeVolume || 0) >= 500 },
];

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function fmt(n) { return Math.round(n).toLocaleString("fa-IR"); }
// same Persian-numeral formatting as fmt(), but keeps one decimal — population, war-fatigue
// deltas etc. were previously rendered with plain Latin digits while every money figure used
// fa-IR digits, which looked inconsistent side by side in an RTL Persian UI.
function fmtDec(n) { return n.toLocaleString("fa-IR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
function rankOf(score) {
  let r = RANKS[0];
  for (const x of RANKS) if (score >= x.min) r = x;
  return r;
}

function freshState() {

// builds relations against the other 19 world powers once the player picks their country
function initRelations(countryId, excludeIds) {
  const excl = excludeIds || [];
  const others = COUNTRIES.filter(c => c.id !== countryId && !excl.includes(c.id));
  const rel = {};
  others.forEach(c => {
    // higher-tier countries start with more military power, and the whole board starts stronger
    // than it used to — a real challenge from turn one, not just in the late game
    const base = c.tier === 4 ? 150 + Math.floor(Math.random() * 70)
      : c.tier === 3 ? 95 + Math.floor(Math.random() * 60)
      : 60 + Math.floor(Math.random() * 45);
    rel[c.name] = { score: 30 + Math.floor(Math.random() * 25), status: "خنثی", power: base, warWins: 0, warTurns: 0, blockadeTurns: 0, flag: c.flag, citiesCaptured: 0 };
  });
  return rel;
}

function chooseCountry(id) {
  const c = COUNTRIES.find(x => x.id === id);
  if (!c) return;
  state.playerCountry = c;
  state.relations = initRelations(id);
  state.leader = generateLeader();
  state.leaderHistory = [];
  log(`🎉 شما رهبری ${c.flag} ${c.name} را در «نبرد امپراتوری‌های ۲» بر عهده گرفتید.`);
  const startStyle = LEADER_STYLES.find(x => x.id === state.leader.styleId);
  log(`👑 ${state.leader.name} (${startStyle.icon} ${startStyle.name}) زمام امور را در دست گرفت.`);
  render();
}

// builds a relation entry representing another *human* hotseat player, so all existing
// diplomacy/war/map code (which just reads state.relations[name]) works unmodified against them
function addHumanRelation(playerState, opponentCountry) {
  playerState.relations[opponentCountry.name] = {
    score: 30, status: "خنثی", power: militaryPowerOf(playerState), warWins: 0, warTurns: 0,
    blockadeTurns: 0, rebellion: 0, flag: opponentCountry.flag, citiesCaptured: 0, isHuman: true,
  };
}

let state = freshState();

// ---------- hotseat (local pass-and-play, 2 human players on one device) ----------
// Lives entirely outside `state` so it survives being swapped in/out when we hand control
// between the two players. Each player has their own full state object (own economy, army,
// relations with the 18 remaining AI countries, leader, resources, etc); the two human players
// also each carry one extra entry in their own `relations` dict representing the *other* human,
// so all the existing diplomacy/war/map UI works against a human opponent with zero changes.
let hotseat = { active: false, turnOf: 1, snapshots: [null, null] };
let hotseatSetupStage = 0; // 0 = not choosing, 1 = picking player 1's country, 2 = picking player 2's country
let hotseatP1Choice = null;

function startHotseatSetup() {
  hotseatSetupStage = 1;
  hotseatP1Choice = null;
  render();
}

function pickHotseatCountry(id) {
  const c = COUNTRIES.find(x => x.id === id);
  if (!c) return;
  if (hotseatSetupStage === 1) {
    hotseatP1Choice = c;
    hotseatSetupStage = 2;
    render();
    return;
  }
  if (hotseatSetupStage === 2) {
    const p1 = freshState();
    p1.playerCountry = hotseatP1Choice;
    p1.relations = initRelations(hotseatP1Choice.id, [c.id]);
    p1.leader = generateLeader();
    p1.leaderHistory = [];
    addHumanRelation(p1, c);
    p1.eventLog = [`🎉 شما رهبری ${hotseatP1Choice.flag} ${hotseatP1Choice.name} را در حالت دو نفره بر عهده گرفتید.`];

    const p2 = freshState();
    p2.playerCountry = c;
    p2.relations = initRelations(c.id, [hotseatP1Choice.id]);
    p2.leader = generateLeader();
    p2.leaderHistory = [];
    addHumanRelation(p2, hotseatP1Choice);
    p2.eventLog = [`🎉 شما رهبری ${c.flag} ${c.name} را در حالت دو نفره بر عهده گرفتید.`];

    hotseat.active = true;
    hotseat.turnOf = 1;
    hotseat.snapshots = [null, p2];
    state = p1;
    hotseatSetupStage = 0;
    hotseatP1Choice = null;
    render();
  }
}

// keeps each human player's relation-entry-for-the-other in sync: status/blockade/power always
// reflect the live truth, called every render while hotseat is active
function syncHotseatPvp() {
  if (!hotseat.active || !state.playerCountry) return;
  const otherIdx = hotseat.turnOf === 1 ? 1 : 0;
  const other = hotseat.snapshots[otherIdx];
  if (!other || !other.playerCountry || !state.relations[other.playerCountry.name]) return;
  const mine = state.relations[other.playerCountry.name];
  if (!other.relations) other.relations = {};
  if (!other.relations[state.playerCountry.name]) addHumanRelation(other, state.playerCountry);
  const theirs = other.relations[state.playerCountry.name];
  // status/blockade mirror exactly (a war or alliance is a two-sided fact); scores stay
  // independent (each side's own perception), power is always a live read of the real army
  theirs.status = mine.status;
  theirs.blockadeTurns = mine.blockadeTurns;
  theirs.rebellion = mine.rebellion;
  theirs.power = militaryPowerOf(state);
  mine.power = militaryPowerOf(other);
}

function hotseatAdvance() {
  endTurn(); // resolves this player's own full turn (economy, AI wars, focuses, laws, advisor...)
  hotseat.snapshots[hotseat.turnOf - 1] = state;
  if (hotseat.turnOf === 1) {
    hotseat.turnOf = 2;
    state = hotseat.snapshots[1];
  } else {
    hotseat.turnOf = 1;
    state = hotseat.snapshots[0];
  }
  state.flash = { title: `🎮 نوبت بازیکن ${hotseat.turnOf}`, body: `اکنون ${state.playerCountry.flag} ${state.playerCountry.name} را رهبری می‌کنید. دستگاه را به بازیکن ${hotseat.turnOf} بدهید.`, tone: "info" };
  render();
}

const statusColor = { "خنثی": "#8a92a3", "اتحاد": "#4caf7d", "تجارت": "#c9a24b", "جنگ": "#c0453f", "تحت سلطه": "#9b7fd4" };
function annexWinsNeeded(country) {
  const p = state.relations[country].power;
  if (p >= 130) return 6;
  if (p >= 80) return 5;
  return 4;
}

// parameterized so it can be evaluated against *any* saved state snapshot — needed to compute
// a live power reading for the other human player in hotseat mode without swapping state
function militaryPowerOf(s) {
  const base = s.soldiers / 6000 + s.tanks * 0.9 + s.artillery * 1.3 + s.jets * 2.6 + s.ships * 2 + (s.hasNuclearWeapon ? 40 : 0);
  return base + (s.leader ? leaderStyle(s).militaryBonus : 0);
}
function militaryPower() {
  return militaryPowerOf(state);
}
function powerScore() {
  const econ = clamp(state.treasury / 120 + state.factories * 3 + state.oilFields * 4, 0, 100);
  const mil = clamp(militaryPower(), 0, 100);
  const tech = clamp(state.techLevel, 0, 100);
  const pop = clamp(state.population * 1.1, 0, 100);
  const relVals = Object.values(state.relations).map(r => r.score);
  const dipl = clamp(relVals.reduce((a, b) => a + b, 0) / relVals.length, 0, 100);
  return Math.round(econ * 0.25 + mil * 0.25 + tech * 0.2 + pop * 0.15 + dipl * 0.15);
}

function incomeBreakdown() {
  const employmentRate = (100 - state.unemployment) / 100;
  const taxIncome = state.population * 9 * employmentRate * (state.taxRate / 100);
  const oilIncome = state.oilFields * 140;
  const industryEfficiency = state.powerPlants >= state.factories ? 1 : 0.6;
  const factoryIncome = state.factories * 190 * industryEfficiency;
  const tradeBonus = Object.values(state.relations).filter(r => r.status === "تجارت").length * 160;
  const allianceBonus = Object.values(state.relations).filter(r => r.status === "اتحاد").length * 110;
  const tributeIncome = Object.values(state.relations).filter(r => r.status === "تحت سلطه").length * 220;
  const blockadeIncome = Object.values(state.relations).filter(r => (r.blockadeTurns || 0) > 0).length * 120;
  const warUpkeep = Object.values(state.relations).filter(r => r.status === "جنگ").length * 550;
  const inflationMult = 1 + state.inflation / 100;
  const upkeep = ((state.soldiers / 1000) * 2 + state.tanks * 5 + state.artillery * 4 + state.jets * 22 + state.ships * 16 +
    state.factories * 25 + state.hospitals * 35 + state.universities * 35 + state.powerPlants * 18) * inflationMult;

  let netIncome = taxIncome + oilIncome + factoryIncome + tradeBonus + allianceBonus + tributeIncome + blockadeIncome - upkeep - warUpkeep;
  if (state.leader) netIncome *= leaderStyle(state).econMult; // leadership style nudges the whole national budget
  if ((state.resources && state.resources.oil) < 15) netIncome -= 120; // an oil shortage strains industry beyond the plain oilFields count
  if (state.crisisTurns > 0) netIncome *= 0.55;
  if (state.unSanctionTurns > 0) netIncome -= 550; // UN sanctions bite into trade and access to markets

  return { taxIncome, oilIncome, factoryIncome, tradeBonus, allianceBonus, tributeIncome, blockadeIncome, warUpkeep, upkeep, netIncome };
}

function projectNextTurn() {
  const bd = incomeBreakdown();
  const happinessTarget = clamp(68 - state.taxRate * 0.5 - state.unemployment * 0.7 + state.health * 0.18 + state.education * 0.12, 0, 100);
  const happinessDelta = (happinessTarget - state.happiness) * 0.15;
  return { netIncome: bd.netIncome, happinessDelta, atWar: bd.warUpkeep > 0 };
}

function log(msg) {
  state.eventLog = [msg, ...state.eventLog].slice(0, 40);
}
function flashMsg(title, body, tone) {
  state.flash = { title, body, tone: tone || "info" };
}
function spend(cost) {
  if (state.treasury < cost) {
    flashMsg("خزانه کافی نیست", `برای این اقدام به ${fmt(cost)} میلیون دلار نیاز دارید.`, "warn");
    return false;
  }
  state.treasury -= cost;
  return true;
}

// ---------- war justification / UN world opinion ----------
const PERMANENT_MEMBERS = ["آمریکا", "روسیه", "چین"];

function adjustedLegitimacy(reason, r) {
  // attacking a country you're on good terms with looks worse to the world than
  // attacking one you're already hostile with, even for the same stated reason.
  const friendlinessPenalty = Math.max(0, (r.score - 45)) * 0.7;
  return clamp(reason.legitimacy - friendlinessPenalty, 0, 100);
}

function openWarJustify(country) {
  state.warJustifyTarget = country;
  state.unVoteResult = null;
  render();
}

function cancelWarJustify() {
  state.warJustifyTarget = null;
  state.unVoteResult = null;
  render();
}

// how a given permanent member of the Security Council leans on this specific war request
function unMemberStance(member, legit) {
  const memberRel = state.relations[member];
  if (!memberRel) return "self"; // the player is this permanent member
  if (memberRel.status === "جنگ") return "oppose"; // a member you're at war with will never bless your wars
  let score = legit * 0.65 + memberRel.score * 0.35;
  if (memberRel.status === "اتحاد") score += 15;
  else if (memberRel.status === "تجارت") score += 6;
  return score >= 45 ? "support" : "oppose";
}

function computeUNVote(country, reasonId) {
  const reason = WAR_REASONS.find(x => x.id === reasonId);
  const r = state.relations[country];
  const legit = adjustedLegitimacy(reason, r);
  // a permanent member does not vote on a case brought against itself
  const voters = PERMANENT_MEMBERS.filter(m => m !== country);
  const stances = voters.map(m => ({ member: m, stance: unMemberStance(m, legit) }));
  const votingStances = stances.filter(s => s.stance !== "self");
  const vetoedBy = votingStances.filter(s => s.stance === "oppose").map(s => s.member);
  return { country, reasonId, legit, stances, approved: vetoedBy.length === 0, vetoedBy };
}

function requestUNVote(country, reasonId) {
  const reason = WAR_REASONS.find(x => x.id === reasonId);
  const r = state.relations[country];
  if (!reason || !r) return;
  if (!reason.available(country, r)) { flashMsg("امکان‌پذیر نیست", reason.unavailableHint || "این دلیل در شرایط فعلی در دسترس نیست.", "warn"); return render(); }
  state.unVoteResult = computeUNVote(country, reasonId);
  render();
}

function finalizeWar(country, reasonId) {
  const reason = WAR_REASONS.find(x => x.id === reasonId);
  const r = state.relations[country];
  if (!reason || !r) return;

  const legit = adjustedLegitimacy(reason, r);
  r.status = "جنگ"; r.score = clamp(r.score - 30, 0, 100); r.warWins = 0; r.warTurns = 0;
  state.warJustifyTarget = null;
  state.unVoteResult = null;

  const opinionDelta = Math.round((legit - 50) / 3);
  state.worldOpinion = clamp(state.worldOpinion + opinionDelta, 0, 100);

  if (legit < 35) {
    state.unSanctionTurns = Math.max(state.unSanctionTurns, 8);
    const others = Object.entries(state.relations).filter(([c2]) => c2 !== country && state.relations[c2].status !== "جنگ" && state.relations[c2].status !== "تحت سلطه");
    others.forEach(([, r2]) => { r2.score = clamp(r2.score - (7 + Math.random() * 6), 0, 100); });
    log(`⚔️ جنگ با ${country} با بهانه «${reason.name}» اعلام شد.`);
    flashMsg("🇺🇳 محکومیت سازمان ملل", `توجیه شما برای این جنگ در نظر جامعه جهانی قانع‌کننده نبود. سازمان ملل قطعنامه محکومیت صادر کرد؛ افکار عمومی جهانی و روابط با سایر کشورها افت کرد و تحریم‌های اقتصادی برای ۸ نوبت اعمال می‌شود.`, "warn");
    // a weakly-justified war can drag in a piling-on rival, not just diplomatic isolation
    const joiners = others.filter(([, r2]) => r2.power > militaryPower() * 0.7);
    if (joiners.length > 0 && Math.random() < 0.4) {
      const [joinCountry, joinR] = joiners[Math.floor(Math.random() * joiners.length)];
      joinR.status = "جنگ"; joinR.score = clamp(joinR.score - 15, 0, 100); joinR.warWins = 0; joinR.warTurns = 0;
      log(`🌍 ${joinCountry} به دلیل محکومیت جهانی این جنگ، به‌طور رسمی وارد جبهه مقابل شما شد!`);
    }
  } else if (legit >= 65) {
    const others = Object.entries(state.relations).filter(([c2]) => c2 !== country);
    others.forEach(([, r2]) => { if (r2.status === "اتحاد" || r2.status === "تجارت") r2.score = clamp(r2.score + 4, 0, 100); });
    state.coalitionBonusTurns = 5; // allies rally material support behind a war the world sees as legitimate
    log(`⚔️ جنگ با ${country} با بهانه موجه «${reason.name}» اعلام شد.`);
    flashMsg("🇺🇳 مشروعیت بین‌المللی", `سازمان ملل و بیشتر کشورهای جهان این جنگ را موجه دانستند. افکار عمومی جهانی نسبت به کشور شما بهبود یافت و متحدانتان تا ۵ نوبت پشتیبانی نظامی می‌فرستند.`);
  } else {
    log(`⚔️ جنگ با ${country} با بهانه «${reason.name}» اعلام شد. واکنش جهانی محتاطانه بود.`);
  }
  render();
}

function buildUNVotePanel(vote) {
  const country = vote.country;
  const reason = WAR_REASONS.find(x => x.id === vote.reasonId);
  const c = cardEl("🇺🇳", `رأی‌گیری شورای امنیت: جنگ با ${country}`, vote.approved ? "#4caf7d" : "#c0453f");
  const sub = document.createElement("div"); sub.className = "card-sub";
  sub.textContent = `دلیل اعلام‌شده: ${reason.icon} ${reason.name} (مشروعیت ${Math.round(vote.legit)}/100)`;
  c.appendChild(sub);

  vote.stances.forEach(s => {
    const row = document.createElement("div"); row.className = "country-row";
    const flag = COUNTRIES.find(x => x.name === s.member)?.flag || "";
    let label, color;
    if (s.stance === "self") { label = "کشور تحت رهبری شما"; color = "#8a92a3"; }
    else if (s.stance === "support") { label = "✅ موافق"; color = "#4caf7d"; }
    else { label = "❌ مخالف (وتو)"; color = "#c0453f"; }
    row.innerHTML = `<span>${flag} ${s.member}</span><span style="color:${color}; font-weight:700;">${label}</span>`;
    c.appendChild(row);
  });

  const verdict = document.createElement("div"); verdict.className = "range-note"; verdict.style.margin = "8px 0";
  verdict.style.color = vote.approved ? "#4caf7d" : "#c0453f";
  verdict.textContent = vote.approved
    ? "شورای امنیت مجوز این جنگ را صادر کرد."
    : `${vote.vetoedBy.join(" و ")} با این جنگ مخالفت کرد؛ شما در حال حاضر حق اعلام رسمی این جنگ را ندارید.`;
  c.appendChild(verdict);

  if (vote.approved) {
    const goBtn = document.createElement("button");
    goBtn.className = "war-btn";
    goBtn.innerHTML = "⚔️ اعلام رسمی جنگ";
    goBtn.onclick = () => finalizeWar(country, vote.reasonId);
    c.appendChild(goBtn);
  }
  const backBtn = document.createElement("button");
  backBtn.className = "action-btn";
  backBtn.style.cssText = "margin-top:6px; justify-content:center;";
  backBtn.textContent = vote.approved ? "انصراف" : "بازگشت و انتخاب دلیل دیگر";
  backBtn.onclick = () => { if (vote.approved) { cancelWarJustify(); } else { state.unVoteResult = null; render(); } };
  c.appendChild(backBtn);

  return c;
}

function buildWarJustifyPanel(country) {
  if (state.unVoteResult && state.unVoteResult.country === country) return buildUNVotePanel(state.unVoteResult);
  const r = state.relations[country];
  const c = cardEl("⚖️", `توجیه اعلام جنگ: ${r.flag ? r.flag + " " : ""}${country}`, "#c0453f");
  const sub = document.createElement("div"); sub.className = "card-sub";
  sub.textContent = "پیش از اعلام جنگ، دلیل خود را برای افکار عمومی جهانی انتخاب کنید. سپس پرونده به شورای امنیت سازمان ملل ارجاع می‌شود؛ اگر آمریکا، روسیه یا چین با آن مخالفت کنند (وتو)، حق اعلام رسمی جنگ نخواهید داشت.";
  c.appendChild(sub);

  WAR_REASONS.forEach(reason => {
    const ok = reason.available(country, r);
    const legit = adjustedLegitimacy(reason, r);
    const legitColor = legit >= 65 ? "#4caf7d" : legit >= 35 ? "#c9a24b" : "#c0453f";
    const btn = document.createElement("button");
    btn.className = "action-btn";
    btn.style.cssText = "flex-direction:column; align-items:flex-start; gap:3px; height:auto; text-align:right;" + (ok ? "" : " opacity:0.45; cursor:not-allowed;");
    btn.innerHTML = `<div style="display:flex; align-items:center; justify-content:space-between; width:100%;"><span>${reason.icon} ${reason.name}</span><span style="font-weight:700; color:${legitColor};">مشروعیت ${Math.round(legit)}</span></div><div style="font-size:11px; color:#8a92a3; font-weight:400;">${ok ? reason.desc : reason.unavailableHint || reason.desc}</div>`;
    if (ok) btn.onclick = () => requestUNVote(country, reason.id);
    else btn.disabled = true;
    c.appendChild(btn);
  });

  const cancelBtn = document.createElement("button");
  cancelBtn.className = "action-btn";
  cancelBtn.style.cssText = "margin-top:6px; justify-content:center;";
  cancelBtn.textContent = "انصراف";
  cancelBtn.onclick = () => cancelWarJustify();
  c.appendChild(cancelBtn);

  return c;
}

function relationAction(country, kind) {
  const r = state.relations[country];
  if (kind === "strengthen") {
    if (!spend(COSTS.strengthen)) return render();
    r.score = clamp(r.score + 10, 0, 100);
    log(`روابط با ${country} تقویت شد.`);
  } else if (kind === "alliance") {
    if (r.score < 60) { flashMsg("امکان‌پذیر نیست", `برای پیشنهاد اتحاد با ${country} باید امتیاز روابط حداقل ۶۰ باشد.`, "warn"); return render(); }
    if (!spend(COSTS.alliance)) return render();
    r.status = "اتحاد"; r.score = clamp(r.score + 5, 0, 100);
    log(`پیمان اتحاد با ${country} امضا شد.`);
  } else if (kind === "trade") {
    if (r.score < 35) { flashMsg("امکان‌پذیر نیست", `روابط با ${country} برای قرارداد تجاری بسیار پایین است.`, "warn"); return render(); }
    if (!spend(COSTS.trade)) return render();
    r.status = "تجارت"; r.score = clamp(r.score + 3, 0, 100);
    log(`قرارداد تجاری با ${country} منعقد شد. درآمد صادرات افزایش می‌یابد.`);
  } else if (kind === "peace") {
    if (!spend(COSTS.peace)) return render();
    r.status = "خنثی"; r.score = clamp(r.score + 15, 0, 100); r.warWins = 0; r.warTurns = 0;
    log(`آتش‌بس با ${country} برقرار شد.`);
  } else if (kind === "annex") {
    if (r.warWins < annexWinsNeeded(country)) { flashMsg("امکان‌پذیر نیست", `برای الحاق ${country} باید ابتدا در ${annexWinsNeeded(country)} نبرد پیروز شوید.`, "warn"); return render(); }
    const cost = COSTS.annex;
    if (!spend(cost)) return render();
    const treasuryLoot = 1200 + Math.floor(Math.random() * 1400);
    const popGain = +(2 + Math.random() * 5).toFixed(1);
    const resourceRoll = Math.random();
    let resourceMsg = "";
    if (resourceRoll < 0.4) { state.oilFields++; resourceMsg = "یک منطقه نفت‌خیز"; }
    else if (resourceRoll < 0.75) { state.factories++; resourceMsg = "چند کارخانه"; }
    else { state.techLevel = clamp(state.techLevel + 4, 0, 100); resourceMsg = "دانش فنی"; }
    state.treasury += treasuryLoot;
    state.population = clamp(state.population + popGain, 1, 2000);
    r.status = "تحت سلطه"; r.score = 100; r.warWins = 0; r.power = Math.round(r.power * 0.3); r.citiesCaptured = CITIES_PER_COUNTRY;
    log(`🏴 سرزمین ${country} الحاق شد! غنیمت ${fmt(treasuryLoot)} میلیون دلار و ${resourceMsg} به دست آمد. اکنون این کشور هر نوبت به شما خراج می‌دهد.`);
  } else if (kind === "sabotage") {
    if (!spend(COSTS.sabotage)) return render();
    const successChance = clamp(0.5 + state.techLevel / 300 - r.power / 500, 0.2, 0.85);
    if (Math.random() < successChance) {
      const loot = 300 + Math.floor(Math.random() * 400);
      r.power = Math.max(10, Math.round(r.power * (0.85 - Math.random() * 0.1)));
      state.treasury += loot;
      log(`🕵️ عملیات خرابکارانه در ${country} با موفقیت انجام شد؛ زیرساخت‌های نظامی آن‌ها تضعیف شد و ${fmt(loot)} میلیون دلار غنیمت به دست آمد.`);
    } else {
      state.treasury -= 250;
      r.score = clamp(r.score - 15, 0, 100);
      log(`🕵️ عملیات خرابکارانه در ${country} لو رفت! روابط دوجانبه به‌شدت آسیب دید و ${fmt(250)} میلیون دلار هزینه شد.`);
      if (r.status !== "جنگ" && Math.random() < 0.25) {
        r.status = "جنگ"; r.warWins = 0; r.warTurns = 0;
        log(`🚨 ${country} به دلیل عملیات لو رفته، رسماً اعلام جنگ داد!`);
      }
    }
  } else if (kind === "blockade") {
    if (state.ships < 3) { flashMsg("امکان‌پذیر نیست", "برای محاصره دریایی حداقل به ۳ ناو جنگی نیاز دارید.", "warn"); return render(); }
    if (!spend(COSTS.blockade)) return render();
    const successChance = clamp(0.35 + state.ships * 0.05 - r.power / 400, 0.15, 0.85);
    if (Math.random() < successChance) {
      const loot = 400 + Math.floor(Math.random() * 400);
      state.treasury += loot;
      r.score = clamp(r.score - 10, 0, 100);
      r.blockadeTurns = 3;
      log(`🚢 محاصره دریایی سواحل ${country} موفقیت‌آمیز بود؛ ${fmt(loot)} میلیون دلار از محموله‌های توقیف‌شده به دست آمد و اقتصاد آن‌ها تا ۳ نوبت مختل می‌شود.`);
    } else {
      const lostShip = Math.random() < 0.5;
      if (lostShip) state.ships = Math.max(0, state.ships - 1);
      state.treasury -= 300;
      r.score = clamp(r.score - 5, 0, 100);
      log(`🚢 محاصره دریایی ${country} با شکست مواجه شد${lostShip ? "؛ یک ناو جنگی از دست رفت" : ""} و ۳۰۰ میلیون دلار هزینه شد.`);
      if (r.status !== "جنگ" && Math.random() < 0.2) {
        r.status = "جنگ"; r.warWins = 0; r.warTurns = 0;
        log(`🚨 ${country} پس از شکست محاصره دریایی، اعلام جنگ داد!`);
      }
    }
  } else if (kind === "incite") {
    if (r.status === "تحت سلطه") { flashMsg("امکان‌پذیر نیست", "این سرزمین از قبل تحت سلطه شماست.", "warn"); return render(); }
    if (!spend(COSTS.incite)) return render();
    // hostile, low-trust populations are easier to stir up than friendly ones
    const successChance = clamp(0.4 + (50 - r.score) / 200 + state.techLevel / 400, 0.15, 0.75);
    if (Math.random() < successChance) {
      r.rebellion = (r.rebellion || 0) + 4;
      state.rebellionsIncited = (state.rebellionsIncited || 0) + 1;
      log(`🔥 گروه‌های نیابتی و شورشیان مسلح در ${country} با حمایت پنهانی شما بسیج شدند؛ قدرت آن‌ها طی چند نوبت آینده کاهش می‌یابد.`);
    } else {
      log(`🔥 تلاش برای سازماندهی شورش در ${country} ناکام ماند و منابع مالی هدر رفت.`);
      if (Math.random() < 0.25) {
        r.score = clamp(r.score - 18, 0, 100);
        log(`🕵️ دخالت شما در امور داخلی ${country} افشا شد؛ روابط دوجانبه به‌شدت آسیب دید.`);
      }
    }
  }
  render();
}

// ---------- proxy rebellions: resolved once per turn, independent of direct war ----------
function resolveRebellions() {
  Object.entries(state.relations).forEach(([country, r]) => {
    if ((r.rebellion || 0) > 0) {
      r.power = Math.max(10, Math.round(r.power * (0.90 - Math.random() * 0.05)));
      r.rebellion--;
      if (r.rebellion === 0) log(`🔥 موج شورش نیابتی در ${country} فروکش کرد.`);
      else if (Math.random() < 0.4) log(`🔥 درگیری‌های داخلی شورشیان در ${country} همچنان ادامه دارد؛ قدرت نظامی آن‌ها تضعیف شده است.`);
    }
  });
}

// ---------- national focuses ----------
function startFocus(id) {
  const f = FOCUS_TREE.find(x => x.id === id);
  if (!f) return;
  if (state.activeFocus) { flashMsg("امکان‌پذیر نیست", "یک کانون ملی هم‌اکنون در حال پیشرفت است.", "warn"); return render(); }
  if (state.completedFocuses.includes(id)) return render();
  if (f.requires.some(r => !state.completedFocuses.includes(r))) { flashMsg("امکان‌پذیر نیست", "ابتدا باید کانون‌های پیش‌نیاز را تکمیل کنید.", "warn"); return render(); }
  if (f.minTech && state.techLevel < f.minTech) { flashMsg("امکان‌پذیر نیست", `سطح فناوری باید حداقل ${f.minTech} باشد.`, "warn"); return render(); }
  if (!spend(f.cost)) return render();
  state.activeFocus = { id, turnsLeft: f.turns };
  log(`🎯 کانون ملی «${f.name}» آغاز شد (${f.turns} نوبت طول می‌کشد).`);
  render();
}

// ---------- laws ----------
function passLaw(id) {
  const lawItem = LAWS.find(x => x.id === id);
  if (!lawItem) return;
  if (state.enactedLaws.includes(id)) return render();
  if (lawItem.minTech && state.techLevel < lawItem.minTech) { flashMsg("امکان‌پذیر نیست", `سطح فناوری باید حداقل ${lawItem.minTech} باشد.`, "warn"); return render(); }
  if (!spend(lawItem.cost)) return render();
  const chance = clamp(0.55 + (state.happiness - 50) / 250, 0.25, 0.9);
  if (Math.random() < chance) {
    lawItem.effect(state);
    state.enactedLaws.push(id);
    log(`⚖️ لایحه «${lawItem.name}» در مجلس به تصویب رسید.`);
  } else {
    state.happiness = clamp(state.happiness - 2, 0, 100);
    log(`🚫 لایحه «${lawItem.name}» در مجلس رأی نیاورد و رد شد.`);
  }
  render();
}

// ---------- random events ----------
function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function triggerRandomEvent() {
  const candidates = ["earthquake", "flood", "mine", "crisis", "disease", "trade_windfall", "science_breakthrough", "national_holiday"];
  if (state.techLevel >= 30) candidates.push("cyberattack");
  if (state.population >= 60) candidates.push("refugee_wave");
  if (state.happiness < 50) candidates.push("protest", "protest", "protest");
  const warEnemies = Object.entries(state.relations).filter(([, r]) => r.status === "جنگ");
  if (warEnemies.length > 0) candidates.push("sabotage", "sabotage");
  // gather EVERY qualifying country, not just the first one found — otherwise the same
  // nation gets picked for these events turn after turn whenever more than one qualifies
  const neutralGoodCandidates = Object.entries(state.relations).filter(([, r]) => r.status === "خنثی" && r.score >= 45);
  if (neutralGoodCandidates.length > 0) candidates.push("alliance_offer", "trade_offer");
  const allyCandidates = Object.entries(state.relations).filter(([, r]) => r.status === "اتحاد" || r.status === "تجارت");
  if (allyCandidates.length > 0) candidates.push("betrayal", "betrayal");
  const kind = pickRandom(candidates);

  if (kind === "earthquake") {
    const dmg = 300 + Math.floor(Math.random() * 500);
    state.treasury -= dmg; state.happiness = clamp(state.happiness - 5, 0, 100);
    if (Math.random() < 0.3 && state.roads > 10) state.roads = clamp(state.roads - 10, 0, 100);
    log(`🌍 زلزله‌ای کشور را لرزاند؛ خسارت ${fmt(dmg)} میلیون دلار به بار آمد.`);
  } else if (kind === "flood") {
    const dmg = 200 + Math.floor(Math.random() * 400);
    state.treasury -= dmg; state.roads = clamp(state.roads - 8, 0, 100); state.happiness = clamp(state.happiness - 3, 0, 100);
    log(`🌊 سیل مناطقی از کشور را درنوردید؛ خسارت ${fmt(dmg)} میلیون دلار.`);
  } else if (kind === "protest") {
    state.happiness = clamp(state.happiness - 8, 0, 100); state.unemployment = clamp(state.unemployment + 1, 0, 100);
    log("📢 اعتراضات مردمی به دلیل نارضایتی عمومی در چند شهر شکل گرفت.");
  } else if (kind === "mine") {
    const bonus = 900 + Math.floor(Math.random() * 1200);
    state.treasury += bonus;
    log(`⛏️ معدن جدیدی کشف شد! ${fmt(bonus)} میلیون دلار به خزانه افزوده شد.`);
  } else if (kind === "crisis") {
    state.crisisTurns = 3; state.treasury -= 800;
    log("📉 بحران اقتصادی جهانی به کشور رسید؛ درآمدها تا سه نوبت کاهش می‌یابد.");
  } else if (kind === "disease") {
    const mitig = clamp(state.hospitals * 3, 0, 15);
    state.health = clamp(state.health - (12 - mitig), 0, 100);
    state.happiness = clamp(state.happiness - (6 - mitig / 2), 0, 100);
    log(state.hospitals > 2
      ? "🦠 شیوع یک بیماری گزارش شد، اما شبکه بیمارستانی کشور اثرات آن را محدود کرد."
      : "🦠 شیوع بیماری در کشور گزارش شد؛ نظام سلامت تحت فشار قرار گرفت.");
  } else if (kind === "trade_windfall") {
    const traders = Object.values(state.relations).filter(r => r.status === "تجارت" || r.status === "اتحاد").length;
    const bonus = 300 + traders * 250 + Math.floor(Math.random() * 300);
    state.treasury += bonus;
    log(traders > 0
      ? `📦 یک فرصت تجاری بزرگ پیش آمد؛ شرکای تجاری شما ${fmt(bonus)} میلیون دلار سود به همراه آورد.`
      : `📦 یک محموله صادراتی غیرمنتظره ${fmt(bonus)} میلیون دلار سود آورد.`);
  } else if (kind === "science_breakthrough") {
    const bonus = 2 + Math.floor(Math.random() * 4) + Math.floor(state.universities / 2);
    state.techLevel = clamp(state.techLevel + bonus, 0, 100);
    log(`🔭 دانشمندان کشور به یک کشف علمی مهم دست یافتند؛ سطح فناوری ${bonus} واحد افزایش یافت.`);
  } else if (kind === "national_holiday") {
    state.happiness = clamp(state.happiness + (3 + Math.floor(Math.random() * 4)), 0, 100);
    log("🎉 جشن ملی با استقبال گسترده مردم برگزار شد؛ رضایت عمومی افزایش یافت.");
  } else if (kind === "cyberattack") {
    const dmg = 250 + Math.floor(Math.random() * 350);
    const mitig = state.techLevel >= 60;
    state.treasury -= mitig ? Math.round(dmg * 0.4) : dmg;
    if (!mitig) state.techLevel = clamp(state.techLevel - 3, 0, 100);
    log(mitig
      ? `💻 یک حمله سایبری خنثی شد؛ زیرساخت‌های دیجیتال پیشرفته خسارت را محدود کردند (${fmt(Math.round(dmg * 0.4))} میلیون دلار).`
      : `💻 یک حمله سایبری ناشناس زیرساخت‌های حیاتی را مختل کرد؛ خسارت ${fmt(dmg)} میلیون دلار و افت جزئی سطح فناوری.`);
  } else if (kind === "refugee_wave") {
    const popGain = +(0.3 + Math.random() * 0.8).toFixed(1);
    const strain = clamp(4 - state.hospitals * 0.4, 0.5, 4);
    state.population = clamp(state.population + popGain, 1, 2000);
    state.happiness = clamp(state.happiness - strain, 0, 100);
    state.unemployment = clamp(state.unemployment + 0.8, 0, 100);
    log(`🧳 موج مهاجرت از مناطق ناآرام همسایه کشور شما را هدف قرار داد؛ جمعیت افزایش یافت اما فشار بر خدمات عمومی رضایت را ${strain < 2 ? "اندکی" : "محسوس"} کاهش داد.`);
  } else if (kind === "sabotage") {
    const enemy = warEnemies.length > 0 ? pickRandom(warEnemies)[0] : null;
    const dmg = 150 + Math.floor(Math.random() * 350);
    state.treasury -= dmg;
    const lostTank = state.tanks > 0 && Math.random() < 0.4;
    if (lostTank) state.tanks--;
    log(`🕵️ عملیات خرابکارانه‌ای از سوی ${enemy || "دشمن"} زیرساخت‌های شما را هدف قرار داد؛ خسارت ${fmt(dmg)} میلیون دلار${lostTank ? " و از دست رفتن یک دسته تانک" : ""}.`);
  } else if (kind === "alliance_offer") {
    const [country, r] = pickRandom(neutralGoodCandidates);
    r.score = clamp(r.score + 22, 0, 100);
    if (r.score >= 65 && Math.random() < 0.5) {
      r.status = "اتحاد";
      log(`🤝 ${country} به‌طور غیرمنتظره پیشنهاد اتحاد داد و پیمان بی‌درنگ امضا شد!`);
    } else {
      log(`🤝 ${country} پیام دوستانه‌ای فرستاد و خواستار نزدیکی روابط شد (امتیاز روابط افزایش یافت).`);
    }
  } else if (kind === "trade_offer") {
    const [country, r] = pickRandom(neutralGoodCandidates);
    r.score = clamp(r.score + 15, 0, 100);
    if (r.score >= 40 && Math.random() < 0.5 && r.status === "خنثی") {
      r.status = "تجارت";
      log(`🚢 ${country} به‌طور غیرمنتظره یک قرارداد تجاری رایگان پیشنهاد داد و پذیرفته شد!`);
    } else {
      log(`🚢 ${country} خواستار گسترش تجارت شد (امتیاز روابط افزایش یافت).`);
    }
  } else if (kind === "betrayal") {
    const [country, r] = pickRandom(allyCandidates);
    const wasAlliance = r.status === "اتحاد";
    r.score = clamp(r.score - 25, 0, 100);
    r.status = "خنثی";
    log(`🗡️ ${country} ${wasAlliance ? "پیمان اتحاد" : "قرارداد تجاری"} را یک‌طرفه لغو کرد؛ روابط دوجانبه سرد شد.`);
  }
}

// ---------- nuclear strike ----------
// only usable against a country you're currently at war with, and only while warheads remain
// in the stockpile. Devastates the target's power and territory instantly but carries severe,
// permanent diplomatic and economic fallout — and a real (if usually small) chance the target
// secretly had its own capability and strikes back.
function canNuke(country) {
  const r = state.relations[country];
  return !!(state.hasNuclearWeapon && (state.nuclearWarheads || 0) > 0 && r && r.status === "جنگ");
}

function nuclearStrike(country) {
  if (!canNuke(country)) return render();
  showConfirmModal(
    `☢️ حمله هسته‌ای به ${country}`,
    "این اقدام غیرقابل بازگشت است: شهرهای هدف ویران می‌شوند، اما افکار عمومی جهانی سقوط می‌کند، تحریم‌های شدید اعمال می‌شود و احتمال کمی وجود دارد که هدف پاسخ متقابل هسته‌ای بدهد. آیا مطمئن هستید؟",
    () => executeNuclearStrike(country)
  );
}

function executeNuclearStrike(country) {
  if (!canNuke(country)) return render();
  const r = state.relations[country];
  state.nuclearWarheads--;

  const isPermanent = PERMANENT_MEMBERS.includes(country);
  r.power = Math.max(5, Math.round(r.power * 0.25));
  const citiesHit = clamp(2 + Math.floor(Math.random() * 2), 0, CITIES_PER_COUNTRY - (r.citiesCaptured || 0));
  r.citiesCaptured = clamp((r.citiesCaptured || 0) + citiesHit, 0, CITIES_PER_COUNTRY);
  r.warWins = (r.warWins || 0) + 2;
  r.score = 0;

  const opinionHit = isPermanent ? 55 : 40;
  state.worldOpinion = clamp(state.worldOpinion - opinionHit, 0, 100);
  state.unSanctionTurns = Math.max(state.unSanctionTurns, 12);
  state.happiness = clamp(state.happiness - 10, 0, 100);
  state.treasury -= 1800;
  Object.entries(state.relations).forEach(([c2, r2]) => {
    if (c2 === country || r2.status === "تحت سلطه") return;
    r2.score = clamp(r2.score - (isPermanent ? 30 : 18) - Math.random() * 10, 0, 100);
  });

  log(`☢️ کشور شما کلاهک هسته‌ای بر ${country} فرود آورد! ${fmt(citiesHit)} شهر ویران و قدرت نظامی آن‌ها به‌شدت فروپاشید (کلاهک باقی‌مانده: ${fmt(state.nuclearWarheads)}).`);
  flashMsg("☢️ حمله هسته‌ای انجام شد", "افکار عمومی جهانی سقوط کرد، تحریم‌های شدید سازمان ملل اعمال شد و روابط شما با تقریباً همهٔ کشورهای جهان به‌شدت آسیب دید.", "warn");

  // small, power-scaled chance the target had a hidden retaliatory capability
  const retaliateChance = clamp(r.power / 900 + (isPermanent ? 0.25 : 0.05), 0.03, 0.5);
  if (Math.random() < retaliateChance) {
    state.treasury -= 2200 + Math.floor(Math.random() * 1200);
    state.happiness = clamp(state.happiness - 18, 0, 100);
    state.soldiers = Math.max(1000, Math.round(state.soldiers * 0.6));
    state.tanks = Math.max(0, Math.round(state.tanks * 0.6));
    state.jets = Math.max(0, Math.round(state.jets * 0.6));
    state.ships = Math.max(0, Math.round(state.ships * 0.6));
    log(`☢️ ${country} با یک ضربه متقابل هسته‌ای پنهانی پاسخ داد! خسارات نظامی و اقتصادی سنگینی به کشور شما وارد شد.`);
    flashMsg("☢️ پاسخ متقابل هسته‌ای", `برخلاف تصور، ${country} به کلاهک‌های هسته‌ای پنهانی دسترسی داشت و ضربه‌ای متقابل وارد کرد.`, "warn");
  }
  render();
}

function resolveWars() {
  // temporary edge from allies who rallied to a war the world saw as legitimate
  const coalitionBonus = state.coalitionBonusTurns > 0 ? militaryPower() * 0.15 : 0;
  Object.entries(state.relations).forEach(([country, r]) => {
    if ((r.blockadeTurns || 0) > 0) r.blockadeTurns--;
    if (r.status === "جنگ") {
      r.warTurns = (r.warTurns || 0) + 1;
      const fatigue = clamp(r.warTurns * 0.6, 0, 14); // prolonged wars grind you down harder each turn they drag on
      const ourPower = militaryPower() + coalitionBonus + Math.random() * 10;
      const theirPower = r.power + Math.random() * 10;
      const weWon = ourPower >= theirPower;
      const lossFactor = (weWon ? 0.035 : 0.10) + fatigue * 0.003;
      state.soldiers = Math.max(1000, Math.round(state.soldiers * (1 - lossFactor)));
      if (!weWon && state.tanks > 0 && Math.random() < 0.35) state.tanks--;
      if (!weWon && state.artillery > 0 && Math.random() < 0.3) state.artillery--;
      if (!weWon && state.jets > 0 && Math.random() < 0.15) state.jets--;
      state.treasury -= (350 + Math.floor(Math.random() * 400) + fatigue * 15);
      state.happiness = clamp(state.happiness - (3 + fatigue * 0.35), 0, 100);
      if (weWon) {
        r.warWins = (r.warWins || 0) + 1;
        state._wonWarThisTurn = true;
        if ((r.citiesCaptured || 0) < CITIES_PER_COUNTRY) {
          r.citiesCaptured = (r.citiesCaptured || 0) + 1;
          log(`🏙️ یکی از شهرهای ${country} تصرف شد (${r.citiesCaptured}/${CITIES_PER_COUNTRY} — روی نقشه به رنگ زرد درآمد).`);
        }
        if (r.warWins >= annexWinsNeeded(country)) {
          log(`🎖️ ارتش شما در نبردها بر ${country} چیره شد؛ اکنون امکان الحاق سرزمین آن‌ها فراهم است.`);
        } else if (Math.random() < 0.18) {
          r.score = clamp(r.score + 8, 0, 100);
          log(`🏳️ پیروزی در نبردها، ${country} خواستار آتش‌بس است (پیشنهاد صلح در دیپلماسی موجود است).`);
        } else {
          log(`⚔️ پیروزی در نبرد با ${country}؛ نبرد ادامه دارد (${r.warWins}/${annexWinsNeeded(country)} پیروزی برای الحاق).`);
        }
      } else {
        r.warWins = 0;
        log(`⚔️ شکست در نبرد با ${country}؛ تلفات و هزینه‌های جنگی سنگین وارد شد${fatigue > 4 ? " — خستگی طولانی جنگ اوضاع را بدتر کرده است" : ""}.`);
      }
    } else if (r.status !== "تحت سلطه") {
      // rival nations keep developing over time, and faster than before — the game gets harder as it goes on
      // a naval blockade sharply slows a rival's development while it's in effect
      const growthMultiplier = (r.blockadeTurns || 0) > 0 ? 0.3 : 1;
      r.power = clamp(r.power + (1.6 + Math.random() * 2.8 + state.turn * 0.14) * growthMultiplier, 10, 380);
      // a country only strikes first after a real pattern of hostility (very low relations, not just lukewarm ones),
      // once it's clearly strong enough to expect victory, and never in the first few turns of the game
      if (state.turn >= 5 && r.score < 20 && r.power > militaryPower() * 1.35 && Math.random() < 0.06) {
        r.status = "جنگ"; r.score = clamp(r.score - 20, 0, 100); r.warWins = 0; r.warTurns = 0;
        state.worldOpinion = clamp(state.worldOpinion + 4, 0, 100); // the world sympathizes with the country attacked without provocation
        log(`🚨 ${country} پس از ماه‌ها تیرگی روابط، به‌طور غافلگیرانه به کشور شما اعلام جنگ داد! افکار عمومی جهانی به نفع شما تغییر کرد.`);
      }
      r.warTurns = 0;
    }
  });
  if (state.coalitionBonusTurns > 0) state.coalitionBonusTurns--;
}

// ---------- achievements ----------
function checkAchievements() {
  if (!Array.isArray(state.unlockedAchievements)) state.unlockedAchievements = [];
  let unlockedAny = false;
  ACHIEVEMENTS.forEach(a => {
    if (state.unlockedAchievements.includes(a.id)) return;
    if (a.check(state)) {
      state.unlockedAchievements.push(a.id);
      unlockedAny = true;
      log(`🏆 دستاورد جدید: «${a.name}» — ${a.desc}`);
    }
  });
  if (unlockedAny) flashMsg("🏆 دستاورد جدید کسب شد!", "برای مشاهده جزئیات به تب «دستاوردها» سر بزنید.");
}

// ---------- leadership generations: aging + succession ----------
function pickHeirs() {
  return [0, 1, 2].map(() => {
    const heir = generateLeader(30, 50);
    return heir;
  });
}
function chooseHeir(idx) {
  if (!state.pendingSuccession || !state.pendingSuccession[idx]) return;
  const heir = state.pendingSuccession[idx];
  if (state.leader) state.leaderHistory.push(state.leader);
  state.leader = heir;
  state.pendingSuccession = null;
  const style = LEADER_STYLES.find(x => x.id === heir.styleId);
  // each leadership style brings a small one-time inauguration bonus reflecting their background
  if (style.id === "general") { state.soldiers += 10000; state.tanks += 2; }
  else if (style.id === "economist") { state.treasury += 700; }
  else if (style.id === "diplomat") { Object.values(state.relations).forEach(r => { if (r.status !== "جنگ") r.score = clamp(r.score + 5, 0, 100); }); }
  else if (style.id === "populist") { state.happiness = clamp(state.happiness + 10, 0, 100); }
  log(`👑 ${heir.name} (${style.icon} ${style.name}) رهبری کشور را در سن ${heir.age} سالگی بر عهده گرفت.`);
  flashMsg("👑 رهبر جدید", `${heir.name} با سبک رهبری «${style.name}» زمام امور را در دست گرفت.`);
  render();
}

// ---------- AI progression ----------
// gives every rival nation a chance, each turn, to visibly act on its own — modernizing its
// army, having an economic boom, suffering unrest, or even going to war with another AI
// country — on top of the steady background power growth already applied in resolveWars().
// This is flavor + a modest power delta layered on top of that baseline, not a replacement
// for it, so overall pacing/difficulty is unchanged; it just becomes visible in the log.
const AI_PROGRESS_EVENTS = [
  { weight: 3, run: (name, r) => {
      const gain = 6 + Math.random() * 9;
      r.power = clamp(r.power + gain, 10, 380);
      log(`🌍 ${name} ارتش خود را نوسازی کرد و قدرت نظامی‌اش افزایش یافت.`);
    } },
  { weight: 3, run: (name, r) => {
      const gain = 4 + Math.random() * 7;
      r.power = clamp(r.power + gain, 10, 380);
      r.score = clamp(r.score + 3, 0, 100);
      log(`🌍 ${name} یک جهش اقتصادی را تجربه کرد و در صحنه جهانی معتبرتر شد.`);
    } },
  { weight: 2, run: (name, r) => {
      const gain = 5 + Math.random() * 8;
      r.power = clamp(r.power + gain, 10, 380);
      log(`🌍 ${name} در فناوری نظامی پیشرفت چشمگیری داشت.`);
    } },
  { weight: 2, run: (name, r) => {
      const loss = 5 + Math.random() * 10;
      r.power = clamp(r.power - loss, 10, 380);
      r.score = clamp(r.score - 3, 0, 100);
      log(`🌍 ${name} دچار ناآرامی داخلی و بحران سیاسی شد؛ قدرت نظامی‌اش کاهش یافت.`);
    } },
  { weight: 2, run: (name, r) => {
      if (r.score >= 45) return;
      r.score = clamp(r.score + 7, 0, 100);
      log(`🌍 ${name} با گسترش دیپلماسی فعال، جایگاه بین‌المللی خود را بهبود بخشید.`);
    } },
];

function aiWorldProgress() {
  const eligible = Object.entries(state.relations).filter(([, r]) => r.status !== "جنگ" && r.status !== "تحت سلطه");
  eligible.forEach(([name, r]) => {
    if (Math.random() < 0.16) {
      const totalWeight = AI_PROGRESS_EVENTS.reduce((sum, e) => sum + e.weight, 0);
      let roll = Math.random() * totalWeight;
      for (const evt of AI_PROGRESS_EVENTS) {
        roll -= evt.weight;
        if (roll <= 0) { evt.run(name, r); break; }
      }
    }
  });
  // occasionally two rival nations clash with each other, entirely independent of the player
  if (eligible.length >= 2 && Math.random() < 0.1) {
    const shuffled = [...eligible].sort(() => Math.random() - 0.5);
    const [nameA, rA] = shuffled[0];
    const [nameB, rB] = shuffled[1];
    const aWins = (rA.power + Math.random() * 15) >= (rB.power + Math.random() * 15);
    const [winnerName, winnerR, loserName, loserR] = aWins ? [nameA, rA, nameB, rB] : [nameB, rB, nameA, rA];
    winnerR.power = clamp(winnerR.power + 4 + Math.random() * 6, 10, 380);
    loserR.power = clamp(loserR.power - (8 + Math.random() * 10), 10, 380);
    log(`🌍 درگیری میان ${nameA} و ${nameB} درگرفت: ${winnerName} پیروز شد و نفوذ منطقه‌ای‌اش افزایش یافت، در حالی که ${loserName} تضعیف شد.`);
  }
}

function endTurn() {
  if (state.gameOver) return;
  // if a succession was pending and the player never picked from the "رهبری" tab, auto-pick
  // the first heir so the game never silently stalls
  if (state.pendingSuccession) chooseHeir(0);
  state._wonWarThisTurn = false;
  const bd = incomeBreakdown();
  let netIncome = bd.netIncome + (Math.random() - 0.5) * 40; // small variance vs. forecast
  if (state.crisisTurns > 0) { state.crisisTurns--; }
  state.treasury += netIncome;

  const growth = state.population * (0.012 + state.health / 3000 - (state.happiness < 30 ? 0.006 : 0));
  state.population = clamp(state.population + growth, 1, 2000);

  const happinessTarget = clamp(68 - state.taxRate * 0.5 - state.unemployment * 0.7 + state.health * 0.18 + state.education * 0.12, 0, 100);
  state.happiness = clamp(state.happiness + (happinessTarget - state.happiness) * 0.15, 0, 100);

  const unemploymentTarget = clamp(20 - state.factories * 1.4 - state.universities * 0.9 - state.roads * 0.05, 2, 60);
  state.unemployment = clamp(state.unemployment + (unemploymentTarget - state.unemployment) * 0.15, 2, 60);

  // prolonged wars and UN sanctions drive prices up, quietly eating into upkeep costs over time
  const atWarCount = Object.values(state.relations).filter(r => r.status === "جنگ").length;
  state.inflation = clamp(state.inflation + 0.25 + atWarCount * 0.35 + (state.unSanctionTurns > 0 ? 0.4 : 0), 0, 60);

  resolveWars();
  resolveRebellions();
  aiWorldProgress();

  // --- resources: light stockpile drift + shortage effects ---
  if (!state.resources) state.resources = { oil: 60, food: 60, tech: 40 };
  state.resources.oil = clamp(state.resources.oil + (state.oilFields * 1.5 - state.factories * 0.8), 0, 300);
  state.resources.food = clamp(state.resources.food + (3 - state.population * 0.03), 0, 300);
  state.resources.tech = clamp(state.resources.tech + (state.universities * 0.5 - 0.3), 0, 300);
  if (state.resources.food < 15) { state.happiness = clamp(state.happiness - 3, 0, 100); log("🌾 کمبود ذخایر غذایی رضایت عمومی را کاهش داد."); }
  if (state.resources.tech >= 180 && Math.random() < 0.15) { state.techLevel = clamp(state.techLevel + 3, 0, 100); state.resources.tech -= 40; log("🔬 ذخیره بزرگ منابع فناوری به یک جهش علمی کوچک انجامید."); }

  // --- diplomatic peace streak, tracked for the "صد نوبت بدون جنگ" achievement ---
  const anyWarNow = Object.values(state.relations).some(r => r.status === "جنگ");
  state.peaceStreak = anyWarNow ? 0 : (state.peaceStreak || 0) + 1;

  if (state.unSanctionTurns > 0) state.unSanctionTurns--;
  state.worldOpinion = clamp(state.worldOpinion + (58 - state.worldOpinion) * 0.06, 0, 100);
  if (Math.random() < 0.5) triggerRandomEvent();

  if (state.activeFocus) {
    state.activeFocus.turnsLeft--;
    if (state.activeFocus.turnsLeft <= 0) {
      const f = FOCUS_TREE.find(x => x.id === state.activeFocus.id);
      if (f) { f.effect(state); state.completedFocuses.push(f.id); log(`✅ کانون ملی «${f.name}» تکمیل شد.`); }
      state.activeFocus = null;
    }
  }

  state.turn++; state.year++;

  // --- leadership generations: leader ages every turn; old age can trigger succession ---
  if (state.leader) {
    state.leader.age++;
    if (!state.pendingSuccession && (state.leader.age >= 80 || (state.leader.age >= 65 && Math.random() < 0.03))) {
      state.pendingSuccession = pickHeirs();
      log(`👑 ${state.leader.name} به دلیل کهولت سن از قدرت کناره‌گیری کرد.`);
      flashMsg("👑 جانشینی رهبری", "وارث بعدی را از تب «رهبری» انتخاب کنید؛ در غیر این صورت یک وارث پیش‌فرض در نوبت بعد انتخاب می‌شود.", "warn");
    }
  }

  checkAchievements();

  // --- general loyalty: fighting without wins (or an empty treasury) erodes trust in command;
  // real wins and peacetime let it recover. If it bottoms out for too long, the army moves against you.
  const activeWars = Object.values(state.relations).filter(r => r.status === "جنگ").length;
  if (activeWars > 0) {
    state.generalLoyalty = clamp(state.generalLoyalty + (state._wonWarThisTurn ? 6 : -(3 + activeWars * 1.5)), 0, 100);
  } else {
    state.generalLoyalty = clamp(state.generalLoyalty + 2, 0, 100);
  }
  if (state.treasury < 0) state.generalLoyalty = clamp(state.generalLoyalty - 4, 0, 100);
  state.coupWarningTurns = state.generalLoyalty <= 12 ? state.coupWarningTurns + 1 : 0;

  if (state.happiness <= 4) state.gameOver = "lose_happiness";
  else if (state.treasury < -3000) state.gameOver = "lose_money";
  else if (state.coupWarningTurns >= 2) { state.gameOver = "lose_coup"; log("⚔️ ژنرالان ارتش که دیگر به رهبری شما اعتماد نداشتند، علیه دولت کودتا کردند."); }
  else if (powerScore() >= 96 && state.turn >= 30 && Object.values(state.relations).every(r => r.status !== "جنگ")) state.gameOver = "win";

  // --- advisor: resolve old advice against what actually happened, then brief on anything new ---
  evaluateAdvisorMemory();
  if (!state.gameOver) {
    generateProactiveBriefing().forEach(n => {
      if (state.advisorMemory.some(m => m.key === n.key && !m.resolved)) return; // already warned, still open
      advisorMessages.push({ role: "advisor-alert", content: n.text });
      state.advisorMemory.push({ turn: state.turn, key: n.key, text: n.text, meta: n.meta || {}, resolved: false, followed: null });
    });
    state.advisorMemory = state.advisorMemory.slice(-30);
  } else if (!state.recapShown) {
    const recap = buildAdvisorRecap();
    if (recap) advisorMessages.push({ role: "advisor-alert", content: "🎞️ مرور تصمیمات (حافظه بلندمدت مشاور):\n\n" + recap });
    state.recapShown = true;
  }

  render();
}

  }

  const c = cardEl("🌍", "انتخاب کشور", "#c9a24b");
  const sub = document.createElement("div"); sub.className = "card-sub";
  if (hotseatSetupStage === 1) sub.textContent = "🎮 حالت دو نفره: بازیکن ۱ کشور خود را انتخاب کند.";
  else if (hotseatSetupStage === 2) sub.textContent = `🎮 حالت دو نفره: اکنون دستگاه را به بازیکن ۲ بدهید و کشوری غیر از ${hotseatP1Choice.flag} ${hotseatP1Choice.name} انتخاب کنید.`;
  else sub.textContent = "نبرد امپراتوری‌های ۲ را با رهبری یکی از ۲۰ قدرت جهانی آغاز کنید. ۱۹ کشور دیگر به‌عنوان رقبا و شرکای شما در بازی حضور خواهند داشت.";
  c.appendChild(sub);
  const grid = document.createElement("div"); grid.className = "grid2-4";
  COUNTRIES.forEach(country => {
    if (hotseatSetupStage === 2 && hotseatP1Choice && country.id === hotseatP1Choice.id) return;
    const btn = document.createElement("button");
    btn.className = "action-btn";
    btn.style.justifyContent = "flex-start";
    btn.innerHTML = `<span>${country.flag} ${country.name}</span>`;
    btn.onclick = () => hotseatSetupStage === 0 ? chooseCountry(country.id) : pickHotseatCountry(country.id);
    grid.appendChild(btn);
  });
  c.appendChild(grid);
  tabContent.appendChild(c);

  document.getElementById("forecastPanel").innerHTML = "";
  const keyStats = document.getElementById("keyStats");
  keyStats.innerHTML = "";
  const logList = document.getElementById("eventLogList");
  logList.innerHTML = "";
  state.eventLog.forEach(e => {
    const item = document.createElement("div"); item.className = "log-item"; item.textContent = e;
    logList.appendChild(item);
  });
}

  document.getElementById("rankLabel").style.color = rank.color;
  document.getElementById("statYear").textContent = fmt(state.year);
  document.getElementById("statTreasury").textContent = fmt(state.treasury) + "M$";

  document.getElementById("statPopulation").textContent = fmtDec(state.population) + "M";
  document.getElementById("statHappiness").textContent = fmt(state.happiness) + "%";

  document.getElementById("powerBar").style.width = powerScore() + "%";

  // tabs

  // flash

  if (state.flash) {
    const box = document.createElement("div");

    box.innerHTML = `<div><div class="flash-title">${state.flash.title}</div><div>${state.flash.body}</div></div>`;
    const closeBtn = document.createElement("button");
    closeBtn.className = "flash-close"; closeBtn.textContent = "✕";
    closeBtn.onclick = () => { state.flash = null; render(); };
    box.appendChild(closeBtn);
    flashArea.appendChild(box);
  }

  // game over
  const goArea = document.getElementById("gameOverArea");
  goArea.innerHTML = "";
  if (state.gameOver) {
    const box = document.createElement("div");
    box.className = "gameover-box";
    if (state.gameOver === "win") {
      box.style.background = "#1c2a1e"; box.style.borderColor = "#3f6b45";
      box.innerHTML = `<div class="gameover-title" style="color:#7fbf8f;">🏆 پیروزی!</div><div class="gameover-body" style="color:#c8d4c9;">کشور شما به یک ابرقدرت جهانی تبدیل شد، در سال ${state.year}.</div>`;
    } else if (state.gameOver === "lose_happiness") {
      box.style.background = "#2a1c1c"; box.style.borderColor = "#6b3f3f";
      box.innerHTML = `<div class="gameover-title" style="color:#e07a6f;">💥 سقوط دولت</div><div class="gameover-body" style="color:#d9c3c1;">نارضایتی عمومی به قیام سراسری انجامید و دولت سقوط کرد.</div>`;
    } else if (state.gameOver === "lose_money") {
      box.style.background = "#2a1c1c"; box.style.borderColor = "#6b3f3f";
      box.innerHTML = `<div class="gameover-title" style="color:#e07a6f;">💸 ورشکستگی</div><div class="gameover-body" style="color:#d9c3c1;">خزانه کشور به‌طور کامل تهی شد و اقتصاد فروپاشید.</div>`;
    } else if (state.gameOver === "lose_coup") {
      box.style.background = "#2a1c1c"; box.style.borderColor = "#6b3f3f";
      box.innerHTML = `<div class="gameover-title" style="color:#e07a6f;">🗡️ کودتای نظامی</div><div class="gameover-body" style="color:#d9c3c1;">وفاداری فرماندهان ارتش به‌کلی از بین رفت و آن‌ها علیه دولت شما کودتا کردند.</div>`;
    }
    if (state.gameOver !== "win" && buildAdvisorRecap()) {
      const recapNote = document.createElement("div");
      recapNote.className = "gameover-body";
      recapNote.style.cssText = "color:#c9a24b; margin-top:6px; font-size:12px;";
      recapNote.textContent = "📼 مشاورت یه مرور از تصمیم‌هایی که نادیده گرفتی آماده کرده — تب «مشاور هوش مصنوعی» رو ببین.";
      box.appendChild(recapNote);
    }
    goArea.appendChild(box);
  }

  renderTabContent();
  renderSidebar();
}

function actionBtn(label, cost, onClick, accent) {
  const btn = document.createElement("button");
  btn.className = "action-btn";
  btn.innerHTML = `<span>${label}</span><span class="action-cost" style="color:${accent || '#c9a24b'};">${fmt(cost)}M$</span>`;
  btn.onclick = onClick;
  return btn;
}

function cardEl(icon, title, accent) {
  const card = document.createElement("div");
  card.className = "card";
  const head = document.createElement("div");
  head.className = "card-head";
  head.innerHTML = `<span class="card-icon">${icon}</span><div class="card-title" style="color:${accent || '#eae6da'};">${title}</div>`;
  card.appendChild(head);
  return card;
}

function statusIcon(status) {
  if (status === "جنگ") return "⚔️";
  if (status === "اتحاد") return "🤝";
  if (status === "تجارت") return "🚢";
  if (status === "تحت سلطه") return "🏴";
  return "🏳️";
}

function polygonPoints(cx, cy, r, sides, seedOffset) {
  const pts = [];
  for (let i = 0; i < sides; i++) {
    const angle = (i / sides) * Math.PI * 2 + seedOffset;
    // irregular radius per vertex so territories look like landmasses, not perfect circles
    const jitter = 0.78 + 0.28 * Math.abs(Math.sin(seedOffset * 3 + i * 2.1));
    const rr = r * jitter;
    pts.push(`${(cx + rr * Math.cos(angle)).toFixed(1)},${(cy + rr * Math.sin(angle)).toFixed(1)}`);
  }
  return pts.join(" ");
}

// number of cities each territory shows on the map and needs captured (one per war win,
// capped at 5) before its color flips fully to "captured yellow"
const CITIES_PER_COUNTRY = 5;
const CITY_CAPTURED_COLOR = "#e6c84a";

function buildMapSVG() {
  const NS = "http://www.w3.org/2000/svg";
  const MAP_SIZE = 760; // enlarged from 520 so 5 cities per territory have room to read clearly
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${MAP_SIZE} ${MAP_SIZE}`);
  svg.setAttribute("width", "100%");
  svg.setAttribute("style", "max-width:820px; display:block; margin:0 auto;");

  const bg = document.createElementNS(NS, "rect");
  bg.setAttribute("x", "0"); bg.setAttribute("y", "0");
  bg.setAttribute("width", MAP_SIZE); bg.setAttribute("height", MAP_SIZE);
  bg.setAttribute("rx", "16"); bg.setAttribute("fill", "#0a121a");
  svg.appendChild(bg);

  // "ocean" grid texture for a world-map feel
  const grid = document.createElementNS(NS, "g");
  grid.setAttribute("opacity", "0.35");
  for (let x = 20; x < MAP_SIZE; x += 24) {
    const l = document.createElementNS(NS, "line");
    l.setAttribute("x1", x); l.setAttribute("y1", 0); l.setAttribute("x2", x); l.setAttribute("y2", MAP_SIZE);
    l.setAttribute("stroke", "#152030"); l.setAttribute("stroke-width", "1");
    grid.appendChild(l);
  }
  for (let y = 20; y < MAP_SIZE; y += 24) {
    const l = document.createElementNS(NS, "line");
    l.setAttribute("x1", 0); l.setAttribute("y1", y); l.setAttribute("x2", MAP_SIZE); l.setAttribute("y2", y);
    l.setAttribute("stroke", "#152030"); l.setAttribute("stroke-width", "1");
    grid.appendChild(l);
  }
  svg.appendChild(grid);

  const rank = rankOf(powerScore());
  const center = { x: MAP_SIZE / 2, y: MAP_SIZE / 2 };
  const ourRadius = clamp(42 + state.population / 3, 46, 92);

  const neighborNames = Object.keys(state.relations);
  const n = neighborNames.length;
  const positions = neighborNames.map((name, i) => {
    const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
    const dist = 300;
    return { name, x: center.x + dist * Math.cos(angle), y: center.y + dist * Math.sin(angle), angle };
  });

  // connecting supply/front lines
  positions.forEach(pos => {
    const r = state.relations[pos.name];
    const line = document.createElementNS(NS, "line");
    line.setAttribute("x1", center.x); line.setAttribute("y1", center.y);
    line.setAttribute("x2", pos.x); line.setAttribute("y2", pos.y);
    line.setAttribute("stroke", statusColor[r.status]);
    line.setAttribute("stroke-width", r.status === "جنگ" ? "3" : "1.5");
    if (r.status === "جنگ") line.setAttribute("stroke-dasharray", "7,5");
    line.setAttribute("opacity", "0.8");
    svg.appendChild(line);
  });

  // our territory (irregular landmass)
  const ourShape = document.createElementNS(NS, "polygon");
  ourShape.setAttribute("points", polygonPoints(center.x, center.y, ourRadius, 9, 0.4));
  ourShape.setAttribute("fill", "#1c2530");
  ourShape.setAttribute("stroke", rank.color);
  ourShape.setAttribute("stroke-width", "3");
  svg.appendChild(ourShape);

  // ground unit markers scattered inside our territory (visual density = army size)
  const groundUnitCount = clamp(Math.round(state.soldiers / 30000) + state.tanks, 3, 14);
  for (let i = 0; i < groundUnitCount; i++) {
    const a = (i / groundUnitCount) * Math.PI * 2 + 0.7;
    const rr = ourRadius * 0.55;
    const ux = center.x + rr * Math.cos(a);
    const uy = center.y + rr * Math.sin(a);
    const unit = document.createElementNS(NS, "text");
    unit.setAttribute("x", ux); unit.setAttribute("y", uy + 3);
    unit.setAttribute("text-anchor", "middle");
    unit.setAttribute("font-size", "9");
    unit.textContent = i % 3 === 0 ? "🛡️" : "⬦";
    unit.setAttribute("fill", i % 3 === 0 ? "#c0453f" : "#7a8a99");
    svg.appendChild(unit);
  }

  const ourIcon = document.createElementNS(NS, "text");
  ourIcon.setAttribute("x", center.x); ourIcon.setAttribute("y", center.y - ourRadius - 10);
  ourIcon.setAttribute("text-anchor", "middle");
  ourIcon.setAttribute("font-size", "22");
  ourIcon.textContent = "👑";
  svg.appendChild(ourIcon);

  const ourLabel = document.createElementNS(NS, "text");
  ourLabel.setAttribute("x", center.x); ourLabel.setAttribute("y", center.y + 4);
  ourLabel.setAttribute("text-anchor", "middle");
  ourLabel.setAttribute("font-size", "11");
  ourLabel.setAttribute("font-weight", "700");
  ourLabel.setAttribute("fill", rank.color);
  ourLabel.textContent = "کشور ما";
  svg.appendChild(ourLabel);

  const ourPowerLabel = document.createElementNS(NS, "text");
  ourPowerLabel.setAttribute("x", center.x); ourPowerLabel.setAttribute("y", center.y + 18);
  ourPowerLabel.setAttribute("text-anchor", "middle");
  ourPowerLabel.setAttribute("font-size", "9");
  ourPowerLabel.setAttribute("fill", "#b9c0cc");
  ourPowerLabel.textContent = `قدرت نظامی ${fmt(militaryPower())}`;
  svg.appendChild(ourPowerLabel);

  // neighbor territories — irregular landmasses, clickable, each carrying 5 cities
  positions.forEach((pos, i) => {
    const r = state.relations[pos.name];
    const radius = clamp(24 + r.power / 7, 24, 52);
    const seed = i * 1.37 + 0.2;
    const captured = clamp(r.citiesCaptured || 0, 0, CITIES_PER_COUNTRY);

    const g = document.createElementNS(NS, "g");
    g.style.cursor = "pointer";
    g.onclick = () => { state.selectedMapCountry = pos.name; render(); };

    const shape = document.createElementNS(NS, "polygon");
    shape.setAttribute("points", polygonPoints(pos.x, pos.y, radius, 7, seed));
    // a fully-captured territory (all 5 cities taken) reads as ours on the map even before annexation
    shape.setAttribute("fill", captured >= CITIES_PER_COUNTRY ? "#241f14" : "#141d27");
    shape.setAttribute("stroke", captured >= CITIES_PER_COUNTRY ? CITY_CAPTURED_COLOR : statusColor[r.status]);
    shape.setAttribute("stroke-width", state.selectedMapCountry === pos.name ? "4" : "2.5");
    g.appendChild(shape);

    // enemy ground unit markers when at war
    if (r.status === "جنگ") {
      const enemyUnits = clamp(Math.round(r.power / 20), 2, 8);
      for (let u = 0; u < enemyUnits; u++) {
        const a = (u / enemyUnits) * Math.PI * 2;
        const ux = pos.x + radius * 0.5 * Math.cos(a);
        const uy = pos.y + radius * 0.5 * Math.sin(a);
        const unit = document.createElementNS(NS, "text");
        unit.setAttribute("x", ux); unit.setAttribute("y", uy + 3);
        unit.setAttribute("text-anchor", "middle");
        unit.setAttribute("font-size", "8");
        unit.setAttribute("fill", "#e07a6f");
        unit.textContent = "⚔️";
        g.appendChild(unit);
      }
    }

    // 5 cities arranged in a ring inside the territory — captured ones turn yellow
    for (let ci = 0; ci < CITIES_PER_COUNTRY; ci++) {
      const cAngle = (ci / CITIES_PER_COUNTRY) * Math.PI * 2 - Math.PI / 2;
      const cDist = radius * 0.62;
      const cx = pos.x + cDist * Math.cos(cAngle);
      const cy = pos.y + cDist * Math.sin(cAngle);
      const isCaptured = ci < captured;
      const dot = document.createElementNS(NS, "circle");
      dot.setAttribute("cx", cx); dot.setAttribute("cy", cy); dot.setAttribute("r", "5.5");
      dot.setAttribute("fill", isCaptured ? CITY_CAPTURED_COLOR : "#141d27");
      dot.setAttribute("stroke", isCaptured ? CITY_CAPTURED_COLOR : "#6b7684");
      dot.setAttribute("stroke-width", "1.4");
      g.appendChild(dot);
    }

    const icon = document.createElementNS(NS, "text");
    icon.setAttribute("x", pos.x); icon.setAttribute("y", pos.y + 5);
    icon.setAttribute("text-anchor", "middle");
    icon.setAttribute("font-size", "13");
    icon.textContent = statusIcon(r.status);
    g.appendChild(icon);

    const nameLabel = document.createElementNS(NS, "text");
    nameLabel.setAttribute("x", pos.x); nameLabel.setAttribute("y", pos.y + radius + 13);
    nameLabel.setAttribute("text-anchor", "middle");
    nameLabel.setAttribute("font-size", "9.5");
    nameLabel.setAttribute("font-weight", "700");
    nameLabel.setAttribute("fill", "#eae6da");
    nameLabel.textContent = `${r.flag || ""} ${pos.name}`;
    g.appendChild(nameLabel);

    const statusLabel = document.createElementNS(NS, "text");
    statusLabel.setAttribute("x", pos.x); statusLabel.setAttribute("y", pos.y + radius + 25);
    statusLabel.setAttribute("text-anchor", "middle");
    statusLabel.setAttribute("font-size", "8.5");
    statusLabel.setAttribute("fill", statusColor[r.status]);
    statusLabel.textContent = `${r.status} · قدرت ${Math.round(r.power)}`;
    g.appendChild(statusLabel);

    const cityLabel = document.createElementNS(NS, "text");
    cityLabel.setAttribute("x", pos.x); cityLabel.setAttribute("y", pos.y + radius + 37);
    cityLabel.setAttribute("text-anchor", "middle");
    cityLabel.setAttribute("font-size", "8");
    cityLabel.setAttribute("fill", captured > 0 ? CITY_CAPTURED_COLOR : "#8a92a3");
    cityLabel.textContent = `🏙️ شهرهای تصرف‌شده: ${fmt(captured)}/${CITIES_PER_COUNTRY}`;
    g.appendChild(cityLabel);

    svg.appendChild(g);
  });

  return svg;
}

// shared by the map panel and the diplomacy tab so the two views can never drift apart —
// previously this block was duplicated in both places with its own copy of costs/labels,
// which is exactly how the two screens could end up disagreeing about what an action costs
function appendCountryActionButtons(c, country, r, showWarWinsNote) {
  if (r.status === "تحت سلطه") {
    const note = document.createElement("div"); note.className = "range-note";
    note.textContent = `این سرزمین تحت سلطه شماست و هر نوبت ${fmt(220)} میلیون دلار خراج می‌پردازد.`;
    c.appendChild(note);
    return;
  }
  if (showWarWinsNote && r.status === "جنگ") {
    const warNote = document.createElement("div"); warNote.className = "range-note";
    warNote.style.marginBottom = "6px";
    warNote.textContent = `پیروزی‌های نبرد: ${r.warWins || 0}/${annexWinsNeeded(country)} (برای الحاق سرزمین لازم است)`;
    c.appendChild(warNote);
  }
  const grid = document.createElement("div"); grid.className = "grid2-4";
  grid.appendChild(actionBtn("تقویت روابط", COSTS.strengthen, () => relationAction(country, "strengthen"), "#5b8fb9"));
  grid.appendChild(actionBtn("پیشنهاد اتحاد", COSTS.alliance, () => relationAction(country, "alliance"), "#4caf7d"));
  grid.appendChild(actionBtn("قرارداد تجاری", COSTS.trade, () => relationAction(country, "trade"), "#c9a24b"));
  if (r.status === "جنگ") {
    grid.appendChild(actionBtn("پیشنهاد آتش‌بس", COSTS.peace, () => relationAction(country, "peace"), "#7fbf8f"));
  } else {
    const warBtn = document.createElement("button");
    warBtn.className = "war-btn";
    warBtn.innerHTML = `⚔️ حمله و اعلام جنگ`;
    warBtn.onclick = () => openWarJustify(country);
    grid.appendChild(warBtn);
  }
  grid.appendChild(actionBtn("🕵️ خرابکاری", COSTS.sabotage, () => relationAction(country, "sabotage"), "#9b7fd4"));
  grid.appendChild(actionBtn("🚢 محاصره دریایی", COSTS.blockade, () => relationAction(country, "blockade"), "#5b8fb9"));
  grid.appendChild(actionBtn("🔥 حمایت از شورشیان", COSTS.incite, () => relationAction(country, "incite"), "#d98a3d"));
  c.appendChild(grid);
  if ((r.rebellion || 0) > 0) {
    const rebelNote = document.createElement("div"); rebelNote.className = "range-note"; rebelNote.style.color = "#d98a3d"; rebelNote.style.margin = "6px 0";
    rebelNote.textContent = `🔥 شورشیان نیابتی همچنان در این کشور فعال‌اند (${r.rebellion} نوبت باقی‌مانده) و قدرت آن‌ها را تضعیف می‌کنند.`;
    c.appendChild(rebelNote);
  }
  if (canNuke(country)) {
    const nukeBtn = document.createElement("button");
    nukeBtn.className = "war-btn";
    nukeBtn.style.cssText = "margin-top:6px; background:#2a1c33; border-color:#9b3fb9; color:#e0a9f0;";
    nukeBtn.innerHTML = `☢️ حمله هسته‌ای (کلاهک‌ها: ${fmt(state.nuclearWarheads)})`;
    nukeBtn.onclick = () => nuclearStrike(country);
    c.appendChild(nukeBtn);
  }
  if (r.status === "جنگ" && (r.warWins || 0) >= annexWinsNeeded(country)) {
    const annexBtn = document.createElement("button");
    annexBtn.className = "action-btn";
    annexBtn.style.cssText = "margin-top:6px; border-color:#9b7fd4; background:#241c33;";
    annexBtn.innerHTML = `<span>🏴 الحاق سرزمین ${country}</span><span class="action-cost" style="color:#9b7fd4;">${fmt(COSTS.annex)}M$</span>`;
    annexBtn.onclick = () => relationAction(country, "annex");
    c.appendChild(annexBtn);
  }
}

function buildMapSelectionPanel() {
  const country = state.selectedMapCountry;
  if (!country || !state.relations[country]) return null;
  if (state.warJustifyTarget === country) return buildWarJustifyPanel(country);
  const r = state.relations[country];
  const c = cardEl("🎯", `کنترل نظامی و دیپلماتیک: ${r.flag ? r.flag + " " : ""}${country}`, statusColor[r.status]);

  const row = document.createElement("div"); row.className = "country-row";
  row.innerHTML = `<span style="color:#8a92a3;">وضعیت: <span style="color:${statusColor[r.status]}; font-weight:700;">${r.status}</span></span><span style="color:#8a92a3;">قدرت نظامی آن‌ها: ${fmt(r.power)}</span>`;
  c.appendChild(row);

  const cityRow = document.createElement("div"); cityRow.className = "country-row";
  const captured = clamp(r.citiesCaptured || 0, 0, CITIES_PER_COUNTRY);
  cityRow.innerHTML = `<span style="color:#8a92a3;">🏙️ شهرهای تصرف‌شده</span><span style="color:${captured > 0 ? CITY_CAPTURED_COLOR : '#8a92a3'}; font-weight:700;">${fmt(captured)}/${CITIES_PER_COUNTRY}</span>`;
  c.appendChild(cityRow);

  if ((r.blockadeTurns || 0) > 0) {
    const bNote = document.createElement("div"); bNote.className = "range-note"; bNote.style.color = "#5b8fb9"; bNote.style.marginBottom = "6px";
    bNote.textContent = `🚢 در محاصره دریایی شماست (${r.blockadeTurns} نوبت باقی‌مانده).`;
    c.appendChild(bNote);
  }

  const compareBar = document.createElement("div"); compareBar.style.cssText = "display:flex; height:8px; border-radius:4px; overflow:hidden; margin-bottom:10px;";
  const ourShare = clamp(militaryPower() / (militaryPower() + r.power) * 100, 4, 96);
  compareBar.innerHTML = `<div style="width:${ourShare}%; background:${rankOf(powerScore()).color};"></div><div style="width:${100 - ourShare}%; background:${statusColor["جنگ"]};"></div>`;
  c.appendChild(compareBar);
  const compareNote = document.createElement("div"); compareNote.className = "range-note"; compareNote.style.marginBottom = "10px";
  compareNote.textContent = ourShare >= 55 ? "ارتش شما در برتری نسبی قرار دارد." : ourShare <= 45 ? "ارتش دشمن قوی‌تر است؛ حمله پرریسک خواهد بود." : "توازن نظامی نزدیک است.";
  c.appendChild(compareNote);

  appendCountryActionButtons(c, country, r, false);
  return c;
}

// deterministic-ish pick so the same country/topic tends to give a consistent-feeling answer
// instead of pure noise every time the player asks again
function hashPick(seed, arr) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  return arr[h % arr.length];
}

// ---------- proactive advisor: the 5 things a real advisor should volunteer, not just answer ----------
function generateProactiveBriefing() {
  const notes = [];
  const r = state.relations || {};
  const wars = Object.entries(r).filter(([, v]) => v.status === "جنگ");

  // 1) geopolitical warning
  if (wars.length >= 2) {
    notes.push({ key: "geo", text: `🌍 هشدار ژئوپلیتیک: همزمان با ${wars.length} کشور (${wars.map(([n]) => n).join("، ")}) در جنگید — مرزهاتون در معرض تهاجم چند جبهه‌ست. تا با یکی از این طرف‌ها آتش‌بس یا صلح نبندید، ریسک شکست همزمان بالاست.` });
  } else {
    const threat = Object.entries(r).find(([, v]) => v.status !== "جنگ" && v.status !== "تحت سلطه" && v.score < 30 && v.power > militaryPower() * 1.2);
    if (threat) notes.push({ key: "geo", text: `🌍 هشدار ژئوپلیتیک: روابط شما با ${threat[0]} به‌شدت تیره‌ست و قدرت نظامیش از شما بالاتره — مرزهاتون در معرض یه حمله غافلگیرکننده‌ست. یا با دیپلماسی روابط رو تعمیر کنید یا سریع ارتشتون رو تقویت کنید.` });
  }

  // 2) economic forecast
  const bd = incomeBreakdown();
  if (wars.length > 0 && bd.netIncome < 0) {
    const turnsToBroke = state.treasury > 0 ? Math.max(1, Math.ceil(state.treasury / Math.abs(bd.netIncome))) : 0;
    notes.push({ key: "econ", text: turnsToBroke > 0 && turnsToBroke <= 12
      ? `📉 پیش‌بینی اقتصادی: اگه این جنگ ${fmt(turnsToBroke)} نوبت دیگه همین‌طور ادامه پیدا کنه، خزانه کاملاً خالی می‌شه و ریسک شورش داخلی جدی می‌شه.`
      : `📉 پیش‌بینی اقتصادی: هزینه‌های جنگ دارن از درآمدتون پیشی می‌گیرن؛ اگه چند نوبت دیگه همین‌طور ادامه پیدا کنه خزانه می‌ره تو منفی.` });
  }

  // 3) loyalty / popularity report
  if (state.generalLoyalty < 45) {
    notes.push({ key: "loyalty", text: `🎖️ گزارش وفاداری: وفاداری فرماندهان ارتش به ${fmt(state.generalLoyalty)}% رسیده. اگه به‌زودی یه پیروزی نظامی یا بهبود محسوس بهشون ندید، احتمال کودتا علیه دولت جدیه.` });
  }

  // 4) diplomatic alternative
  if (wars.length > 0) {
    const enemy = wars[0][0];
    const altCandidates = Object.entries(r).filter(([n, v]) => n !== enemy && v.status !== "جنگ" && v.status !== "اتحاد");
    if (altCandidates.length > 0) {
      const alt = hashPick(enemy + state.turn, altCandidates)[0];
      notes.push({ key: "diplo", text: `🤝 پیشنهاد دیپلماتیک: به‌جای ادامه یا گسترش جنگ با ${enemy}، با ${alt} متحد یا هم‌پیمان تجاری بشید — این باعث می‌شه در بحران تنها نمونید و روی ${enemy} فشار بیشتری وارد بشه.`, meta: { ally: alt } });
    }
  }

  // 5) cost-opportunity analysis (tech/focus tree)
  const availableFocus = FOCUS_TREE.find(f => !state.completedFocuses.includes(f.id) && (!state.activeFocus || state.activeFocus.id !== f.id) &&
    f.requires.every(rq => state.completedFocuses.includes(rq)) && (!f.minTech || state.techLevel >= f.minTech) && state.treasury >= f.cost * 0.5);
  if (!state.activeFocus && availableFocus) {
    notes.push({ key: "tech", text: `💡 تحلیل هزینه-فرصت: کانون ملی «${availableFocus.name}» الان قابل شروعه. رقباتون هم دائم قوی‌تر می‌شن — هرچی دیرتر شروعش کنید، برتری اولیه‌ش رو بیشتر از دست می‌دید.`, meta: { focus: availableFocus.id } });
  }

  return notes;
}

// resolves earlier advice against what actually happened since — did the player follow it or ignore it?
function evaluateAdvisorMemory() {
  const r = state.relations || {};
  const warsCount = Object.values(r).filter(v => v.status === "جنگ").length;
  state.advisorMemory.forEach(m => {
    if (m.resolved) return;
    const age = state.turn - m.turn;
    if (m.key === "geo") {
      if (warsCount <= 1) { m.resolved = true; m.followed = true; }
      else if (age >= 4) { m.resolved = true; m.followed = false; }
    } else if (m.key === "econ") {
      if (warsCount === 0) { m.resolved = true; m.followed = true; }
      else if (state.gameOver === "lose_money") { m.resolved = true; m.followed = false; }
      else if (age >= 6) { m.resolved = true; m.followed = false; }
    } else if (m.key === "loyalty") {
      if (state.generalLoyalty >= 55) { m.resolved = true; m.followed = true; }
      else if (state.gameOver === "lose_coup") { m.resolved = true; m.followed = false; }
      else if (age >= 5) { m.resolved = true; m.followed = false; }
    } else if (m.key === "diplo") {
      const rel = m.meta && m.meta.ally ? r[m.meta.ally] : null;
      if (rel && (rel.status === "اتحاد" || rel.status === "تجارت")) { m.resolved = true; m.followed = true; }
      else if (age >= 5) { m.resolved = true; m.followed = false; }
    } else if (m.key === "tech") {
      const focusId = m.meta && m.meta.focus;
      if (focusId && (state.completedFocuses.includes(focusId) || (state.activeFocus && state.activeFocus.id === focusId))) { m.resolved = true; m.followed = true; }
      else if (age >= 5) { m.resolved = true; m.followed = false; }
    }
  });
}

// end-of-game "long-term memory" reel: the advice you got but didn't act on
function buildAdvisorRecap() {
  const ignored = state.advisorMemory.filter(m => m.followed === false).slice(-3);
  if (ignored.length === 0) return null;
  return ignored.map(m => `نوبت ${fmt(m.turn)}: «${m.text}»\nولی بهش گوش ندادی...`).join("\n\n");
}

  const r = state.relations || {};
  const wars = Object.entries(r).filter(([, v]) => v.status === "جنگ");

  // small talk gets priority only when the message is short and clearly just small talk
  if (text.length < 20) {
    if (has("سلام", "درود", "هی ", "سلام‌ ")) return pick(ADVISOR_GREETINGS);
    if (has("ممنون", "مرسی", "متشکر", "دمت گرم")) return pick(ADVISOR_THANKS);
